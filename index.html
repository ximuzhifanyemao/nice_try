<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DiveDeep - 学习打卡追踪</title>
    <meta name="description" content="通用学习打卡追踪工具：自定义倒计时、学习打卡、科目时长统计、每周学习趋势分析。" />
    <meta name="theme-color" content="#0f172a" />
    <meta property="og:title" content="DiveDeep - 学习打卡追踪" />
    <meta property="og:description" content="通用学习打卡追踪工具：自定义倒计时、学习打卡、科目时长统计、每周学习趋势分析。" />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <!-- PWA：iPad/Android 添加到主屏幕后以独立 App 全屏运行 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="DiveDeep" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="application-name" content="DiveDeep" />
    <script>
      // 首帧前应用主题，避免闪烁（与 src/lib/theme.ts 逻辑保持一致）
      (function () {
        try {
          var saved = localStorage.getItem('app_theme')
          // 「墨夜」已下线：老用户迁到「深色」，保留暗色观感
          if (saved === 'ink') {
            saved = 'dark'
            localStorage.setItem('app_theme', saved)
          }
          // 一次性迁移：老用户的浅色偏好换成纸墨（氛围主题保持不动）
          if (!localStorage.getItem('app_theme_paper_v1')) {
            localStorage.setItem('app_theme_paper_v1', '1')
            if (saved === 'light') {
              saved = 'paper'
              localStorage.setItem('app_theme', saved)
            }
          }
          var known = ['light', 'paper', 'dark', 'dawn', 'dusk', 'starry']
          var prefersDark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
          var savedDark = saved === 'dark' || saved === 'dusk' || saved === 'starry'
          var dark = known.indexOf(saved) >= 0 ? savedDark : prefersDark
          var root = document.documentElement
          if (known.indexOf(saved) >= 0) {
            root.setAttribute('data-theme', saved)
          } else {
            // 默认主题：纸墨（系统深色偏好时用深色）
            root.setAttribute('data-theme', prefersDark ? 'dark' : 'paper')
          }
          if (dark) root.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
