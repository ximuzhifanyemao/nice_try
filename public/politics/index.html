   "html": "<p class=\"kp-line\"><span class=\"c-rose\">康熙底线心存贞洁<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">土<\/span><span class=\"c-red\">地<\/span><span class=\"c-blue\">革命时期：<\/span><span class=\"c-red\">限<\/span><span class=\"c-blue\">制富农<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">《兴国土地法》<\/span><span class=\"c-gray\">将“没收一切土地〞改为“<\/span><span class=\"c-blue\">没收一切公共<\/span><span class=\"c-blue\">土地及地主阶级的土地<\/span><span class=\"c-gray\">〞这是一个原则性的改正<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">抗<\/span><span class=\"c-blue\">日战争时期：<\/span><span class=\"c-blue\">减租减<\/span><span class=\"c-red\">息<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">解<\/span><span class=\"c-blue\">放战争时期：<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">“五四指示”<\/span><span class=\"c-gray\">改“减租减息”为“耕者有其田”<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">《土地法大纲》<\/span><span class=\"c-red\">征<\/span><span class=\"c-blue\">收富农多余土地<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">新<\/span><span class=\"c-blue\">中国成立后<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">《中华人民共和国土地改革法》<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">废除<\/span><span class=\"c-blue\">地主阶级封建剥削的土地所有制<\/span><span class=\"c-gray\">，实行农民的土地所<\/span><span class=\"c-gray\">有制，<\/span><span class=\"c-blue\">保<\/span><span class=\"c-red\">存<\/span><span class=\"c-gray\">富农经济的政策<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">社会主义改造时期<\/span><span class=\"c-rose\">从限制富农到逐步消灭富农<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">“地主不分田，富农分坏田”<\/span><span class=\"c-gray\">—王明“左”倾教条主<\/span><span class=\"c-gray\">义错误<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">没收地主土地，不再对地主分配土地<\/span><\/p>",

   "html": "<p class=\"kp-line\"><span class=\"c-blue\">四个统一战线<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-blue\">①大革命时期<\/span><span class=\"c-gray\">，<\/span><span class=\"c-red\">国民革命联合战线<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-blue\">②土地革命时期<\/span><span class=\"c-gray\">，因为大革命后汪蒋叛变，民资和部分小<\/span><span class=\"c-gray\">资跟国民党跑了只剩下工人和农民留在共产党，故此时是<\/span><span class=\"c-red\">工农民主统一战线<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-blue\">③抗日战争时期<\/span><span class=\"c-gray\">，<\/span><span class=\"c-red\">抗日民族统一战线<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-blue\">④解放战争时期<\/span><span class=\"c-gray\">我们争求尽可能的人民（除了工农也包括<\/span><span class=\"c-gray\">富农，民资等）与国民党进行最终决战，此时形成<\/span><span class=\"c-red\">人民民<\/span><span class=\"c-red\">主统一战线<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">新民主主义革命时期，以<\/span><span class=\"c-purple\">国共合作<\/span><span class=\"c-gray\">为基础所建立的统一战<\/span><span class=\"c-gray\">线有：<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">国民革命联合战线，抗日民族统一战线<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">必要性和可能性：<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">①中国革命<\/span><span class=\"c-red\">必须<\/span><span class=\"c-blue\">建立最广泛的统一战线<\/span><span class=\"c-gray\">，这是由<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">中国半殖民地半封建社会的<\/span><span class=\"c-blue\">阶级<\/span><span class=\"c-gray\">状况所决定的<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">中国革命的长期性、残酷性及其发展的<\/span><span class=\"c-blue\">不平衡<\/span><span class=\"c-gray\">性所決定的<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">②半殖民地半封建的中国社会交织在一起的诸多矛盾，<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">决定的是<\/span><span class=\"c-blue\">建立最广泛的统一战线的<\/span><span class=\"c-red\">可能性<\/span><span class=\"c-gray\">，而不是必要性<\/span><span class=\"c-gray\">。<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">决定必要性的是阶级，不平衡<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">必须<\/span><span class=\"c-blue\">选国情，<\/span><span class=\"c-red\">可能<\/span><span class=\"c-blue\">选矛盾<\/span><\/p>",
   "plain": "四个统一战线 ①大革命时期，国民革命联合战线 ②土地革命时期，因为大革命后汪蒋叛变，民资和部分小资跟国民党跑了只剩下工人和农民留在共产党，故此时是工农民主统一战线 ③抗日战争时期，抗日民族统一战线 ④解放战争时期我们争求尽可能的人民（除了工农也包括富农，民资等）与国民党进行最终决战，此时形成人民民主统一战线 新民主主义革命时期，以国共合作为基础所建立的统一战线有： 国民革命联合战线，抗日民族统一战线 必要性和可能性： ①中国革命必须建立最广泛的统一战线，这是由 中国半殖民地半封建社会的阶级状况所决定的 中国革命的长期性、残酷性及其发展的不平衡性所決定的 ②半殖民地半封建的中国社会交织在一起的诸多矛盾， 决定的是建立最广泛的统一战线的可能性，而不是必要性。 决定必要性的是阶级，不平衡 必须选国情，可能选矛盾",
   "page": 26
  },

   "title": "政权性质",
   "category": "史纲",
   "group": "重要专题",
   "html": "<p class=\"kp-line\"><span class=\"c-blue\">土地革命战争时期建立的苏维埃政权的性质<\/span><\/p><p class=\"kp-line\"><span class=\"c-rose\">工农民主专政<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">中华苏维埃共和国是中国历史上第一个全国性的工农民主<\/span><span class=\"c-blue\">政权<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">抗日战争时期建立的政权的性质<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">是<\/span><span class=\"c-rose\">抗日民族统一战线<\/span><span class=\"c-gray\">性质的政权<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">是一切赞成<\/span><span class=\"c-rose\">抗日<\/span><span class=\"c-gray\">又赞成<\/span><span class=\"c-rose\">民主<\/span><span class=\"c-gray\">的人们的政权<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">解放战争时期建立的政权的性质<\/span><\/p><p class=\"kp-line\"><span class=\"c-rose\">各个革命阶级的联合专政<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">新中国成立初期建立的政权的性质<\/span><\/p><p class=\"kp-line\"><span class=\"c-rose\">人民民主专政<\/span><\/p>",
   "plain": "土地革命战争时期建立的苏维埃政权的性质 工农民主专政 中华苏维埃共和国是中国历史上第一个全国性的工农民主政权 抗日战争时期建立的政权的性质 是抗日民族统一战线性质的政权 是一切赞成抗日又赞成民主的人们的政权 解放战争时期建立的政权的性质 各个革命阶级的联合专政 新中国成立初期建立的政权的性质 人民民主专政",
   "page": 27
  },

   "no": 80,
   "title": "马克思主义中国化",
   "category": "史纲",
   "group": "重要专题",
   "html": "<p class=\"kp-line\"><span class=\"c-gray\">马克思主义中国化<\/span><span class=\"c-red\">三次飞跃<\/span>（成果）<\/p><p class=\"kp-line\"><span class=\"c-blue\">中共七大<\/span><span class=\"c-gray\">确立<\/span><span class=\"c-blue\">毛泽东思想<\/span><span class=\"c-gray\">为党的指导思想<\/span><span class=\"c-blue\">（第一次）<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">中国特色社会主义理论体系<\/span><span class=\"c-gray\">改革开放后<\/span><span class=\"c-blue\">（第二次）<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">习近平新时代中国特色社会主义思想<\/span><span class=\"c-blue\">（新的飞跃<\/span><span class=\"c-blue\">非第三次）<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">马克思主义中国化的<\/span><span class=\"c-red\">两次结合<\/span>（过程）<\/p><p class=\"kp-line\"><span class=\"c-gray\">马克思主义同<\/span><span class=\"c-blue\">中国<\/span><span class=\"c-orange\">革命<\/span><span class=\"c-gray\">实际的结合<\/span><\/p><p class=\"kp-line\">正式提出命题<span class=\"c-blue\">六届六中全会《论新阶段》<\/span><\/p><p class=\"kp-line\">共产党成立就开始了<\/p><p class=\"kp-line\"><span class=\"c-gray\">马克思主义同<\/span><span class=\"c-blue\">中国社会主义<\/span><span class=\"c-orange\">建设<\/span><span class=\"c-gray\">实际的结合<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">1956《论十大关系》<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">六六结合<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">七大飞跃<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">五六结合<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">改革飞跃<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">关于结合完成问题<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">20世纪30年代<\/span><span class=\"c-gray\">马克思主义与中国实际第一次相结合<\/span><\/p><p class=\"kp-line\"><span class=\"c-rose\">“第一次结合”<\/span><span class=\"c-gray\">即实行马克思主义同中国新民主主义革命<\/span><span class=\"c-gray\">结合<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">这一任务是<\/span><span class=\"c-orange\">完成了<\/span><span class=\"c-gray\">的，<\/span><span class=\"c-rose\">形成了<\/span><span class=\"c-gray\">毛泽东思想，<\/span><span class=\"c-rose\">取得了<\/span><span class=\"c-gray\">新民主<\/span><span class=\"c-gray\">主义革命的胜利<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">1956年社会主义基本制度在中国确立的时候<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">毛泽东明确提出了把马克思列宁主义基本原理同中国具体<\/span><span class=\"c-gray\">实际进行<\/span><span class=\"c-rose\">“第二次结合”<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">但是，毛泽东<\/span><span class=\"c-orange\">没有完成<\/span><span class=\"c-gray\">这一任务，邓小平也<\/span><span class=\"c-orange\">没有完成<\/span><span class=\"c-gray\">第二<\/span><span class=\"c-gray\">次结合<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">事实上“三个代表”重要思想、科学发展观等都属于马克<\/span><span class=\"c-gray\">思主义与中国实际的第二次结合的范畴，<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">因此<\/span><span class=\"c-red\">不能说<\/span><span class=\"c-blue\">邓小平同志完成了马克思主义与中国实际的第二次结合<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">两个结合<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">把马克思主义基本原理同<\/span><span class=\"c-blue\">中国具体实际<\/span><span class=\"c-gray\">相结合<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">把马克思主义基本原理同<\/span><span class=\"c-blue\">中华优秀传统文化<\/span><span class=\"c-gray\">相结合<\/span><\/p><p class=\"kp-line\"><span class=\"c-orange\">毛泽东思想<\/span><span class=\"c-red\">无改革<\/span><span class=\"c-orange\">中国特色社会主义理论体系<\/span><span class=\"c-red\">无革命<\/span><\/p><p class=\"kp-line\"><span class=\"c-orange\">马克思主义中国化时代化<\/span><span class=\"c-red\">都有<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">中特理论体系——<\/span><span class=\"c-red\">革命<\/span><span class=\"c-gray\">和建设<\/span><\/p><p class=\"kp-line\"><span class=\"c-rose\">错误<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">毛泽东思想——革命和建设<\/span><\/p><p class=\"kp-line\">正确<\/p><p class=\"kp-line\"><span class=\"c-gray\">马克思主义中国化时代化<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">魂脉<\/span>—<span class=\"c-blue\">马克思主义<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">根脉<\/span>—<span class=\"c-blue\">中华优秀传统文化<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">四种提法的正误判断<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">中国早期的马克思主义者<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">已在<\/span><span class=\"c-gray\">实际上初步形成了马克思主义应当与中国具体实际相<\/span><span class=\"c-gray\">结合的思想<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">中国早期的马克思主义思想运动<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">从一开始就<\/span><span class=\"c-orange\">明确提出<\/span><span class=\"c-gray\">马克思主义与中国实际相结合的命题<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">中国早期的马克思主义者<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">一开始就<\/span><span class=\"c-gray\">坚持了马克思主义中国化的革命原则和正确方向<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">中国共产党所领导的改革开放<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">从一开始就<\/span><span class=\"c-gray\">具有明确的社会主义方向<\/span><\/p>",
   "plain": "马克思主义中国化三次飞跃（成果） 中共七大确立毛泽东思想为党的指导思想（第一次） 中国特色社会主义理论体系 改革开放后（第二次） 习近平新时代中国特色社会主义思想（新的飞跃非第三次） 马克思主义中国化的两次结合（过程） 马克思主义同中国革命实际的结合 正式提出命题 六届六中全会《论新阶段》 共产党成立就开始了 马克思主义同中国社会主义建设实际的结合 1956《论十大关系》 六六结合 七大飞跃 五六结合 改革飞跃 关于结合完成问题 20世纪30年代 马克思主义与中国实际第一次相结合 “第一次结合”即实行马克思主义同中国新民主主义革命结合 这一任务是完成了的，形成了毛泽东思想，取得了新民主主义革命的胜利 1956年社会主义基本制度在中国确立的时候 毛泽东明确提出了把马克思列宁主义基本原理同中国具体实际进行“第二次结合” 但是，毛泽东没有完成这一任务，邓小平也没有完成第二次结合 事实上“三个代表”重要思想、科学发展观等都属于马克思主义与中国实际的第二次结合的范畴， 因此不能说邓小平同志完成了马克思主义与中国实际的第二次结合 两个结合 把马克思主义基本原理同中国具体实际相结合 把马克思主义基本原理同中华优秀传统文化相结合 毛泽东思想无改革 中国特色社会主义理论体系无革命 马克思主义中国化时代化都有 中特理论体系——革命和建设 错误 毛泽东思想——革命和建设 正确 马克思主义中国化时代化 魂脉—马克思主义 根脉—中华优秀传统文化 四种提法的正误判断 中国早期的马克思主义者 已在实际上初步形成了马克思主义应当与中国具体实际相结合的思想 中国早期的马克思主义思想运动 从一开始就明确提出马克思主义与中国实际相结合的命题 中国早期的马克思主义者 一开始就坚持了马克思主义中国化的革命原则和正确方向 中国共产党所领导的改革开放 从一开始就具有明确的社会主义方向",
   "page": 27
  },
  {
   "no": 81,
   "title": "毛泽东思想形成与发展各时期著作",
   "category": "史纲",
   "group": "重要专题",
   "html": "<p class=\"kp-line\">开始萌芽：<span class=\"c-red\">一阶级两农民<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">大革命时期<\/span><span class=\"c-rose\">关于新民主主义革命的基本思想的提出<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">《中国社会各<\/span><span class=\"c-red\">阶级<\/span><span class=\"c-blue\">分析》<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">《国民革命与<\/span><span class=\"c-red\">农民<\/span><span class=\"c-blue\">运动》<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">《湖南<\/span><span class=\"c-red\">农民<\/span><span class=\"c-blue\">运动考察报告》<\/span><\/p><p class=\"kp-line\">开始形成/初步形成：<span class=\"c-red\">红星冈本<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">土地革命时期<\/span><span class=\"c-rose\">理论上阐述了中国革命的新道路：<\/span><\/p><p class=\"kp-line\"><span class=\"c-rose\">农村包围城市、武装夺取政权的思想<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">《<\/span><span class=\"c-blue\">中国的<\/span><span class=\"c-red\">红<\/span><span class=\"c-blue\">色政权为什么能够存在》<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">《<\/span><span class=\"c-red\">星<\/span><span class=\"c-blue\">星之火 可以燎原》<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">《<\/span><span class=\"c-blue\">井<\/span><span class=\"c-red\">冈<\/span><span class=\"c-blue\">山的斗争》<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">《<\/span><span class=\"c-blue\">反对<\/span><span class=\"c-red\">本<\/span><span class=\"c-blue\">本主义》<\/span><\/p><p class=\"kp-line\">趋于成熟：<span class=\"c-red\">两党三论改造政府<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">遵义会议以后直至抗日战争时期<\/span><\/p><p class=\"kp-line\"><span class=\"c-rose\">对新民主主义革命理论作了系统的阐述<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">《实践<\/span><span class=\"c-red\">论<\/span><span class=\"c-blue\">》<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">《矛盾<\/span><span class=\"c-red\">论<\/span><span class=\"c-blue\">》<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">《〈共产<\/span><span class=\"c-red\">党<\/span><span class=\"c-blue\">人〉发刊词》<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">《中国革命和中国共产<\/span><span class=\"c-red\">党<\/span><span class=\"c-blue\">》<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">《新民主主义<\/span><span class=\"c-red\">论<\/span><span class=\"c-blue\">》<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">《<\/span><span class=\"c-red\">改造<\/span><span class=\"c-blue\">我们的学习》<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">《论联合<\/span><span class=\"c-red\">政府<\/span><span class=\"c-blue\">》<\/span><\/p><p class=\"kp-line\">继续发展：<span class=\"c-red\">两论两在一关于<\/span><\/p><p class=\"kp-line\"><span class=\"c-rose\">人民民主专政理论的完整论述<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">《<\/span><span class=\"c-red\">在<\/span><span class=\"c-blue\">中国共产党第七届中央委员会第二次全体会议上的报<\/span><span class=\"c-blue\">告》<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">《<\/span><span class=\"c-red\">在<\/span><span class=\"c-blue\">晋绥干部会议上的讲话》<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">《<\/span><span class=\"c-red\">论<\/span><span class=\"c-blue\">人民民主专政》<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">《<\/span><span class=\"c-red\">论<\/span><span class=\"c-blue\">十大关系》<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">《<\/span><span class=\"c-red\">关于<\/span><span class=\"c-blue\">正确处理人民内部矛盾的问题》<\/span><\/p><p class=\"kp-line\"><span class=\"c-purple\">毛泽东思想命名：中共七大<\/span><\/p>",
   "plain": "开始萌芽：一阶级两农民 大革命时期 关于新民主主义革命的基本思想的提出 《中国社会各阶级分析》 《国民革命与农民运动》 《湖南农民运动考察报告》 开始形成/初步形成：红星冈本 土地革命时期 理论上阐述了中国革命的新道路： 农村包围城市、武装夺取政权的思想 《中国的红色政权为什么能够存在》 《星星之火 可以燎原》 《井冈山的斗争》 《反对本本主义》 趋于成熟：两党三论改造政府 遵义会议以后直至抗日战争时期 对新民主主义革命理论作了系统的阐述 《实践论》 《矛盾论》 《〈共产党人〉发刊词》 《中国革命和中国共产党》 《新民主主义论》 《改造我们的学习》 《论联合政府》 继续发展：两论两在一关于 人民民主专政理论的完整论述 《在中国共产党第七届中央委员会第二次全体会议上的报告》 《在晋绥干部会议上的讲话》 《论人民民主专政》 《论十大关系》 《关于正确处理人民内部矛盾的问题》 毛泽东思想命名：中共七大",
   "page": 28

   "html": "<p class=\"kp-line\"><span class=\"c-blue\">《中国社会各阶级分析》<\/span><span class=\"c-gray\">：<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-blue\">①分析了各阶级在革命中的作用和地位<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-blue\">②提出“谁是我们的敌人？谁是我们的朋友”这个革命的<\/span><span class=\"c-blue\">首要问题<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">即<\/span><span class=\"c-orange\">分清敌友是革命的首要问题<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">中国社会是一个<\/span><span class=\"c-red\">两头小中间大<\/span><span class=\"c-gray\">的社会<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">两小头<\/span><span class=\"c-gray\">：<\/span><span class=\"c-orange\">无产阶级<\/span><span class=\"c-gray\">和<\/span><span class=\"c-orange\">地主大资产阶级<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">一大头<\/span><span class=\"c-gray\">：<\/span><span class=\"c-orange\">农民、城市小资产阶级以及其他的中间阶级<\/span><\/p>",
   "plain": "《中国社会各阶级分析》： ①分析了各阶级在革命中的作用和地位 ②提出“谁是我们的敌人？谁是我们的朋友”这个革命的首要问题 即分清敌友是革命的首要问题 中国社会是一个两头小中间大的社会 两小头：无产阶级和地主大资产阶级 一大头：农民、城市小资产阶级以及其他的中间阶级",

   "no": 83,

   "category": "史纲",
   "group": "重要专题",
   "html": "<p class=\"kp-line is-bullet\"><span class=\"c-gray\">(1)<\/span><span class=\"c-blue\">《中国的<\/span><span class=\"c-red\">红色<\/span><span class=\"c-blue\">政权为什么能够存在？》《<\/span><span class=\"c-red\">井冈山<\/span><span class=\"c-blue\">的斗<\/span><span class=\"c-blue\">争》<\/span><span class=\"c-gray\">：<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">论证了红色政权能够长期存在并发展的主客观条件<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">提出了<\/span><span class=\"c-orange\">工农武装割据<\/span><span class=\"c-gray\">的思想<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">口诀：<\/span><span class=\"c-orange\">工农割据<\/span><span class=\"c-gray\">了<\/span><span class=\"c-red\">红色井冈山<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">(2)<\/span><span class=\"c-blue\">《星星之火，可以燎原》<\/span><span class=\"c-gray\">：<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">回答了<\/span><span class=\"c-blue\">“红旗到底打得多久〞<\/span><span class=\"c-gray\">的疑问。<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">(3)<\/span><span class=\"c-blue\">《反对本本主义》<\/span><span class=\"c-gray\">：<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">①为了<\/span><span class=\"c-red\">反对<\/span><span class=\"c-gray\">当时红军中的<\/span><span class=\"c-red\">教条主义<\/span><span class=\"c-gray\">思想而写的<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">②提出了<\/span><span class=\"c-blue\">“没有<\/span><span class=\"c-red\">调查<\/span><span class=\"c-blue\">，没有发言权”<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">“<\/span><span class=\"c-red\">调查<\/span><span class=\"c-blue\">就像‘十月怀胎’，解决问题就像‘一朝分娩’，<\/span><span class=\"c-red\">调查<\/span><span class=\"c-blue\">就是解决问题”<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">“中国革命斗争的胜利要靠中国同志<\/span><span class=\"c-red\">了解<\/span><span class=\"c-blue\">中国<\/span><span class=\"c-red\">情况<\/span><span class=\"c-blue\">”<\/span><\/p><p class=\"kp-line\"><span class=\"c-orange\">（这是独立自主思想的最初的明确表述）<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">记住调查和了解情况这两个词即可<\/span><\/p>",
   "plain": "(1) 《中国的红色政权为什么能够存在？》《井冈山的斗争》： 论证了红色政权能够长期存在并发展的主客观条件 提出了工农武装割据的思想 口诀：工农割据了红色井冈山 (2)《星星之火，可以燎原》： 回答了“红旗到底打得多久〞的疑问。 (3)《反对本本主义》： ①为了反对当时红军中的教条主义思想而写的 ②提出了“没有调查，没有发言权” “调查就像‘十月怀胎’，解决问题就像‘一朝分娩’，调查就是解决问题” “中国革命斗争的胜利要靠中国同志了解中国情况” （这是独立自主思想的最初的明确表述） 记住调查和了解情况这两个词即可",
   "page": 28

   "no": 84,
   "title": "成熟",
   "category": "史纲",
   "group": "重要专题",
   "html": "<p class=\"kp-line\"><span class=\"c-blue\">《论反对日本帝国主义的策略》<\/span><span class=\"c-gray\">：（瓦窑堡会议的文件）<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">系统地说明了党的<\/span><span class=\"c-orange\">政治策略<\/span><span class=\"c-gray\">上的诸问题。<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">《论持久战》<\/span><span class=\"c-gray\">：<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">①分析了中日双方相互矛盾的四个基本特点<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">②科学地预测了抗日战争的发展进程，即<\/span><span class=\"c-blue\">抗日战争将经过<\/span><span class=\"c-blue\">战略防御、战略相持、战略反攻三个阶段<\/span><span class=\"c-gray\">。<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">其中，<\/span><span class=\"c-orange\">战略相持阶段<\/span><span class=\"c-gray\">，是中国抗日战争取得最后胜利的<\/span><span class=\"c-red\">最<\/span><span class=\"c-red\">关键<\/span><span class=\"c-gray\">的阶段。<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">③驳斥了“速胜论”和“亡国论”，提出<\/span><span class=\"c-blue\">“兵民是胜利之<\/span><span class=\"c-blue\">本”<\/span><span class=\"c-gray\">的论断。<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">《论<\/span><span class=\"c-red\">联合<\/span><span class=\"c-blue\">政府》<\/span><span class=\"c-gray\">：<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">进一步把新民主主义的<\/span><span class=\"c-red\">政治、经济和文化<\/span><span class=\"c-gray\">与党的基本<\/span><span class=\"c-red\">纲领<\/span><span class=\"c-gray\">联系起来，<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">进行了具体阐述，<\/span><span class=\"c-orange\">形成了新民主主义的基本<\/span><span class=\"c-red\">纲领<\/span><span class=\"c-gray\">。<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">只用记住三纲联合<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">新民主主义的经济纲领<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">①没收封建地主阶级的土地归农民<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">②没收官僚资本归新民主主义国家<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">③<\/span><span class=\"c-blue\">保护民族工商业<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">（也是新民主主义经济纲领中极具<\/span><span class=\"c-blue\">特色<\/span><span class=\"c-gray\">的一项内容）<\/span><\/p>",
   "plain": "《论反对日本帝国主义的策略》：（瓦窑堡会议的文件） 系统地说明了党的政治策略上的诸问题。 《论持久战》： ①分析了中日双方相互矛盾的四个基本特点 ②科学地预测了抗日战争的发展进程，即抗日战争将经过战略防御、战略相持、战略反攻三个阶段。 其中，战略相持阶段，是中国抗日战争取得最后胜利的最关键的阶段。 ③驳斥了“速胜论”和“亡国论”，提出“兵民是胜利之本”的论断。 《论联合政府》： 进一步把新民主主义的政治、经济和文化与党的基本纲领联系起来， 进行了具体阐述，形成了新民主主义的基本纲领。 只用记住三纲联合 新民主主义的经济纲领 ①没收封建地主阶级的土地归农民 ②没收官僚资本归新民主主义国家 ③保护民族工商业 （也是新民主主义经济纲领中极具特色的一项内容）",
   "page": 28
  },
  {
   "no": 85,
   "title": "继续发展",
   "category": "史纲",
   "group": "重要专题",
   "html": "<p class=\"kp-line is-bullet\"><span class=\"c-gray\">(1)<\/span><span class=\"c-blue\">《在晋绥干部会议上的讲话》<\/span><span class=\"c-gray\">：<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">完整地<\/span><span class=\"c-gray\">提出新民主主义革命总路线和总政策<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">完整：在革命对象中增加了官僚资本主义<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">(2)<\/span><span class=\"c-blue\">《论人民民主专政》<\/span><span class=\"c-gray\">：<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">总结了党成立以来<\/span><span class=\"c-orange\">领导民主革命的经验<\/span><span class=\"c-gray\">：<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">工人阶级（经过共产党）领导的以工农联盟为基础的人民<\/span><span class=\"c-red\">民主专政<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">七届二中全会的决议和毛泽东的《论人民民主专政》,<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">构成了《中国人民政治协商会议共同纲领》的基础<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">(3) 1956年4月<\/span><span class=\"c-blue\">《论十大关系》<\/span><span class=\"c-gray\">：<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">①初步总结了我国社会主义建设的经验，<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">明确提出了<\/span><span class=\"c-orange\">以苏为鉴、独立自主<\/span><span class=\"c-blue\">地探索适合中国情况的社<\/span><span class=\"c-blue\">会主义建设道路<\/span><span class=\"c-gray\">。<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">另一种说法：<\/span><span class=\"c-blue\">明确了建设社会主义的根本思想是<\/span><span class=\"c-orange\">根据本国<\/span><span class=\"c-orange\">情况走自己的路<\/span><span class=\"c-gray\">。<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">②围绕一个<\/span><span class=\"c-red\">基本方针<\/span><span class=\"c-gray\">，即<\/span><span class=\"c-orange\">调动一切积极因素为社会主义服<\/span><span class=\"c-orange\">务<\/span><span class=\"c-gray\">。<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">③<\/span><span class=\"c-blue\">是以毛泽东为主要代表的<\/span><span class=\"c-orange\">中国共产党人开始探索适合中<\/span><span class=\"c-orange\">国国情的社会主义建设道路<\/span><span class=\"c-red\">的标志<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">/<\/span><span class=\"c-red\">标志着<\/span><span class=\"c-orange\">党探索中国社会主义建设道路的良好开端<\/span><span class=\"c-gray\">。<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">十全十美好开端<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">它在新的历史条件下从经济和政治方面提出了新的指导方<\/span><span class=\"c-blue\">针，为<\/span><span class=\"c-orange\">中共八大<\/span><span class=\"c-blue\">的召开作了理论准备。<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">④<\/span><span class=\"c-blue\">论述的第一大关系是<\/span><span class=\"c-orange\">重工业、轻工业和农业<\/span><span class=\"c-blue\">的关系<\/span><span class=\"c-gray\">。<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">(4) 1957年2月<\/span><span class=\"c-blue\">《关于正确处理人民内部矛盾的问题》<\/span><span class=\"c-gray\">：<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">①<\/span><span class=\"c-red\">毛泽东明确提出了中国工业化道路的问题，主要是指重<\/span><span class=\"c-red\">工业和轻工业、农业的发展关系问题<\/span><span class=\"c-gray\">，<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">强调要走一条<\/span><span class=\"c-orange\">有别于苏联<\/span><span class=\"c-blue\">的中国工业化道路<\/span><span class=\"c-gray\">。<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">②<\/span><span class=\"c-blue\">形成一套系统的关于<\/span><span class=\"c-red\">社会主义社会矛盾<\/span><span class=\"c-blue\">的学说<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">社会主义社会的基本矛盾同以往社会的基本矛盾具有根本<\/span><span class=\"c-gray\">不同的性质和情况是：<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">社会主义基本矛盾<\/span><span class=\"c-rose\">“又相适应又相矛盾”<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">解决人民内部矛盾的一系列具体方针原则：<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">在<\/span><span class=\"c-blue\">政治思想领域<\/span><span class=\"c-gray\">上实行<\/span><span class=\"c-orange\">“团结—批评一团结”<\/span><span class=\"c-gray\">的方针<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">在<\/span><span class=\"c-blue\">共产党与民主党派的关系<\/span><span class=\"c-gray\">上实行<\/span><span class=\"c-orange\">“长期共存、互相<\/span><span class=\"c-orange\">监督”<\/span><span class=\"c-gray\">的方针<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">在<\/span><span class=\"c-blue\">科学文化工作<\/span><span class=\"c-gray\">中实行<\/span><span class=\"c-orange\">“百花齐放、百家争鸣”<\/span><span class=\"c-gray\">的方针<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">在<\/span><span class=\"c-blue\">物质利益分配<\/span><span class=\"c-gray\">方面中实行<\/span><span class=\"c-orange\">“统筹兼顾、适当安排”<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">的方针<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">民族<\/span><span class=\"c-gray\">之间实行<\/span><span class=\"c-orange\">“民主平等，团结互助”<\/span><span class=\"c-gray\">的方针<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">对于<\/span><span class=\"c-blue\">人民群众和政府机关<\/span><span class=\"c-gray\">，要坚持<\/span><span class=\"c-orange\">民主集中制原则<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">③关于正确处理人民内部矛盾的问题是社会主义国家政治<\/span><span class=\"c-gray\">生活的主题。这一论断的<\/span><span class=\"c-orange\">根本着眼点<\/span><span class=\"c-gray\">，<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">调动一切积极因素为社会主义服务<\/span><\/p>",
   "plain": "(1)《在晋绥干部会议上的讲话》： 完整地提出新民主主义革命总路线和总政策 完整：在革命对象中增加了官僚资本主义 (2)《论人民民主专政》： 总结了党成立以来领导民主革命的经验： 工人阶级（经过共产党）领导的以工农联盟为基础的人民民主专政 七届二中全会的决议和毛泽东的《论人民民主专政》, 构成了《中国人民政治协商会议共同纲领》的基础 (3) 1956年4月《论十大关系》： ①初步总结了我国社会主义建设的经验， 明确提出了以苏为鉴、独立自主地探索适合中国情况的社会主义建设道路。 另一种说法：明确了建设社会主义的根本思想是根据本国情况走自己的路。 ②围绕一个基本方针，即调动一切积极因素为社会主义服务。 ③是以毛泽东为主要代表的中国共产党人开始探索适合中国国情的社会主义建设道路的标志 /标志着党探索中国社会主义建设道路的良好开端。 十全十美好开端 它在新的历史条件下从经济和政治方面提出了新的指导方针，为中共八大的召开作了理论准备。 ④论述的第一大关系是重工业、轻工业和农业的关系。 (4) 1957年2月《关于正确处理人民内部矛盾的问题》： ①毛泽东明确提出了中国工业化道路的问题，主要是指重工业和轻工业、农业的发展关系问题， 强调要走一条有别于苏联的中国工业化道路。 ②形成一套系统的关于社会主义社会矛盾的学说 社会主义社会的基本矛盾同以往社会的基本矛盾具有根本不同的性质和情况是： 社会主义基本矛盾“又相适应又相矛盾” 解决人民内部矛盾的一系列具体方针原则： 在政治思想领域上实行“团结—批评一团结”的方针 在共产党与民主党派的关系上实行“长期共存、互相监督”的方针 在科学文化工作中实行“百花齐放、百家争鸣”的方针 在物质利益分配方面中实行“统筹兼顾、适当安排” 的方针 民族之间实行“民主平等，团结互助”的方针 对于人民群众和政府机关，要坚持民主集中制原则 ③关于正确处理人民内部矛盾的问题是社会主义国家政治生活的主题。这一论断的根本着眼点， 调动一切积极因素为社会主义服务",

   "html": "<p class=\"kp-line\"><span class=\"c-blue\">中共一大 1921<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-blue\">(1)大会<\/span><span class=\"c-orange\">确定党的名称<\/span><span class=\"c-blue\">为“中国共产党”,通过中国共产党<\/span><span class=\"c-blue\">的<\/span><span class=\"c-orange\">第一个纲领<\/span><span class=\"c-blue\">和决议。<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-blue\">(2)大会在讨论实际工作计划时，决定<\/span><span class=\"c-orange\">首先集中精力组织<\/span><span class=\"c-orange\">工人<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-blue\">(3)大会决定设立中央局作为党的临时领导机构。<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">中共二大 1922<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-blue\">(1)第一次提出了<\/span><span class=\"c-orange\">反帝反封建<\/span><span class=\"c-blue\">的民主革命的纲领<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-blue\">(2)开始采取<\/span><span class=\"c-orange\">群众路线<\/span><span class=\"c-blue\">的方法<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-blue\">(3)正式提出<\/span><span class=\"c-orange\">民主联合战线<\/span><span class=\"c-blue\">的主张，<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">这是党最早提出关于<\/span><span class=\"c-orange\">统一战线<\/span><span class=\"c-blue\">的思想和主张，<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">主要目的是实现<\/span><span class=\"c-orange\">反帝反军阀<\/span><span class=\"c-blue\">的革命目标<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">中共三大 1923<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">正式决定全体共产党员以<\/span><span class=\"c-orange\">个人名义<\/span><span class=\"c-blue\">加入国民党<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">国民党一大 1924<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-blue\">(1)对三民主义作出新的解释，即<\/span><span class=\"c-orange\">“新三民主义”<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">事实上确认了<\/span><span class=\"c-orange\">联俄、联共、扶助农工<\/span><span class=\"c-blue\">的三大革命政策<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-blue\">(2)<\/span><span class=\"c-orange\">新三民主义的政纲同当时中共基本一致，因而成为国<\/span><span class=\"c-orange\">共合作的政治基础<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-blue\">(3)标志着<\/span><span class=\"c-orange\">第一次国共合作正式形成<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">中共四大 1925<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-blue\">(1)提出了<\/span><span class=\"c-orange\">无产阶级在民主革命中的<\/span><span class=\"c-red\">领导权<\/span><span class=\"c-orange\">问题<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-blue\">(2)提出了<\/span><span class=\"c-orange\">工农联盟<\/span><span class=\"c-blue\">问题<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-blue\">(3)对民主革命的内容作了更加完整的规定<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">中共五大 1927<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-blue\">(1)提出<\/span><span class=\"c-orange\">争取无产阶级对革命的领导权<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-blue\">(2)建立革命民主政权和实行土地革命等一些正确的原则<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">但对无产阶级如何争取革命领导权、如何领导农民实<\/span><span class=\"c-gray\">行土地革命,<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">特别是如何建立党领导的革命武装等问题,没有提出有效<\/span><span class=\"c-gray\">的具体措施,<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">难以承担起挽救革命的任务。<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">八七会议 1927<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-blue\">(1)八七会议总结了<\/span><span class=\"c-orange\">大革命失败<\/span><span class=\"c-blue\">的经验教训<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">巴适<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-blue\">(2)坚决纠正和结束了陈独秀的右倾主义错误<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-blue\">(3)确定了土地革命和武装反抗国民党反动派的总方针<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-blue\">(4)第一次提出了“政权是由枪杆子中取得的”思想<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">古田会议 1929<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-blue\">(1)立了<\/span><span class=\"c-orange\">思想建党、政治建军<\/span><span class=\"c-blue\">原则<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">中心思想是<\/span><span class=\"c-orange\">要用无产阶级思想进行军队和党的建设<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-blue\">(2)阐述了<\/span><span class=\"c-orange\">加强党的思想建设的极端重要性，指明党内各<\/span><span class=\"c-orange\">种非无产阶级思想的表现、来源及纠正办法<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-blue\">(3)规定了中国的<\/span><span class=\"c-orange\">红军是一个执行革命的政治任务的武装<\/span><span class=\"c-orange\">集团<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-blue\">(4)创造性地解决了在农村环境中、 在党组织和军队以农<\/span><span class=\"c-blue\">民为主要成分的条件下，如何保持党的无产阶级<\/span><span class=\"c-red\">先锋<\/span><span class=\"c-blue\">队性<\/span><span class=\"c-blue\">质和建设党领导的新型人民<\/span><span class=\"c-red\">军队<\/span><span class=\"c-blue\">的重大问题<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">古田先锋军队<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">遵义会议 1935<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-blue\">(1)党的历史上一个<\/span><span class=\"c-orange\">生死攸关的转折点<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-blue\">(2)事实上确立了<\/span><span class=\"c-orange\">毛泽东<\/span><span class=\"c-blue\">在党中央和红军的<\/span><span class=\"c-orange\">领导地位<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">开始确立以毛泽东同志为主要代表的马克思主义正确路线<\/span><span class=\"c-blue\">在党中央的<\/span><span class=\"c-orange\">领导地位<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">开始形成以<\/span><span class=\"c-orange\">毛泽东同志为核心<\/span><span class=\"c-blue\">的<\/span><span class=\"c-orange\">第一代中央领导集体<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-blue\">(3)集中解决了当时具有决定意义的<\/span><span class=\"c-orange\">军事问题和组织问题<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">遵君主<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-blue\">(4)遵义会议的一系列重大决策<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">是在中国共产党同共产国际的联系中断的情况下<\/span><span class=\"c-orange\">独立自主<\/span><span class=\"c-blue\">地作出的<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">遵义会议开启了党<\/span><span class=\"c-orange\">独立自主<\/span><span class=\"c-blue\">解决中国革命实际问题的新阶<\/span><span class=\"c-blue\">段<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">尊嘟假嘟<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-blue\">(5)遵义会议的鲜明特点是<\/span><span class=\"c-orange\">坚持真理、修正错误<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">遵义修理<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">瓦窑堡 1935<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-blue\">(1)解决党的<\/span><span class=\"c-orange\">政治路线<\/span><span class=\"c-blue\">问题<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">镇馆之宝<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-blue\">(2)提出了党的<\/span><span class=\"c-orange\">抗日民族统一战线<\/span><span class=\"c-blue\">的新政策<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">瓦罗兰特，统一战线<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">洛川会议 1937<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-blue\">(1)洛川会议制定了抗日救国十大纲领<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">强调要打倒日本帝国主义 关键在于：<\/span><\/p><p class=\"kp-line\"><span class=\"c-orange\">使已然发动的抗战成为全面的全民族的抗战<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-blue\">(2)<\/span><span class=\"c-orange\">标志着党的全面抗战路线的正式形成<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">川面/洛克王国，全面抗战<\/span><\/p>",
   "plain": "中共一大 1921 (1)大会确定党的名称为“中国共产党”,通过中国共产党的第一个纲领和决议。 (2)大会在讨论实际工作计划时，决定首先集中精力组织工人 (3)大会决定设立中央局作为党的临时领导机构。 中共二大 1922 (1)第一次提出了反帝反封建的民主革命的纲领 (2)开始采取群众路线的方法 (3)正式提出民主联合战线的主张， 这是党最早提出关于统一战线的思想和主张， 主要目的是实现反帝反军阀的革命目标 中共三大 1923 正式决定全体共产党员以个人名义加入国民党 国民党一大 1924 (1)对三民主义作出新的解释，即“新三民主义” 事实上确认了联俄、联共、扶助农工的三大革命政策 (2)新三民主义的政纲同当时中共基本一致，因而成为国共合作的政治基础 (3)标志着第一次国共合作正式形成 中共四大 1925 (1)提出了无产阶级在民主革命中的领导权问题 (2)提出了工农联盟问题 (3)对民主革命的内容作了更加完整的规定 中共五大 1927 (1)提出争取无产阶级对革命的领导权 (2)建立革命民主政权和实行土地革命等一些正确的原则 但对无产阶级如何争取革命领导权、如何领导农民实行土地革命, 特别是如何建立党领导的革命武装等问题,没有提出有效的具体措施, 难以承担起挽救革命的任务。 八七会议 1927 (1)八七会议总结了大革命失败的经验教训 巴适 (2)坚决纠正和结束了陈独秀的右倾主义错误 (3)确定了土地革命和武装反抗国民党反动派的总方针 (4)第一次提出了“政权是由枪杆子中取得的”思想 古田会议 1929 (1)立了思想建党、政治建军原则 中心思想是要用无产阶级思想进行军队和党的建设 (2)阐述了加强党的思想建设的极端重要性，指明党内各种非无产阶级思想的表现、来源及纠正办法 (3)规定了中国的红军是一个执行革命的政治任务的武装集团 (4)创造性地解决了在农村环境中、 在党组织和军队以农民为主要成分的条件下，如何保持党的无产阶级先锋队性质和建设党领导的新型人民军队的重大问题 古田先锋军队 遵义会议 1935 (1)党的历史上一个生死攸关的转折点 (2)事实上确立了毛泽东在党中央和红军的领导地位 开始确立以毛泽东同志为主要代表的马克思主义正确路线在党中央的领导地位 开始形成以毛泽东同志为核心的第一代中央领导集体 (3)集中解决了当时具有决定意义的军事问题和组织问题 遵君主 (4)遵义会议的一系列重大决策 是在中国共产党同共产国际的联系中断的情况下独立自主地作出的 遵义会议开启了党独立自主解决中国革命实际问题的新阶段 尊嘟假嘟 (5)遵义会议的鲜明特点是坚持真理、修正错误 遵义修理 瓦窑堡 1935 (1)解决党的政治路线问题 镇馆之宝 (2)提出了党的抗日民族统一战线的新政策 瓦罗兰特，统一战线 洛川会议 1937 (1)洛川会议制定了抗日救国十大纲领 强调要打倒日本帝国主义 关键在于： 使已然发动的抗战成为全面的全民族的抗战 (2)标志着党的全面抗战路线的正式形成 川面/洛克王国，全面抗战",

   "html": "<p class=\"kp-line\"><span class=\"c-red\">《实践论》《矛盾论》 1937<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">(1)<\/span><span class=\"c-orange\">从马克思主义认识论的新高度总结中国共产党的历史<\/span><span class=\"c-orange\">经验<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">(2)<\/span><span class=\"c-orange\">揭露和批判党内的主观主义 尤其是教条主义错误<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">(3)<\/span><span class=\"c-orange\">深入论证马克思列宁主义基本原理同中国具体实际相<\/span><span class=\"c-orange\">结合的原则<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">(4)<\/span><span class=\"c-red\">科学阐明了党的马克思主义的思想路线<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">六届六中 1938<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">(1)<\/span><span class=\"c-orange\">毛泽东明确提出<\/span><span class=\"c-red\">“马克思主义的中国化”<\/span><span class=\"c-orange\">命题<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">(2)<\/span><span class=\"c-orange\">全会基本<\/span><span class=\"c-red\">纠正了王明的右倾<\/span><span class=\"c-orange\">错误<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">延安整风 1941-1945<\/span><\/p><p class=\"kp-line\"><span class=\"c-orange\">一切从实际出发 理论联系实际<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">实事求是<\/span><span class=\"c-orange\">的马克思主义思想路线 在全党范围<\/span><span class=\"c-red\">确立<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">六届七中 《关于若干历史问题的决议》1945<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">(1)<\/span><span class=\"c-red\">使全党特别是党的高级干部对中国革命基本问题的认<\/span><span class=\"c-red\">识达到了一致<\/span><span class=\"c-orange\">增强了全党团结<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">(2)<\/span><span class=\"c-red\">充分肯定了确立毛泽东在全党领导地位的重大意义<\/span><span class=\"c-orange\">，<\/span><span class=\"c-orange\">分清了是非<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">(3)<\/span><span class=\"c-orange\">为七大的胜利召开<\/span><span class=\"c-red\">在思想上做了充分准备<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">(4)<\/span><span class=\"c-red\">标志着延安整风运动的胜利结束<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">七大 1945<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">(1)<\/span><span class=\"c-orange\">毛泽东在会上作题为《论联合政府》的书面报告和《<\/span><span class=\"c-orange\">愚公移山》闭幕词<\/span><\/p><p class=\"kp-line\"><span class=\"c-orange\">七个小矮人联合起来愚公移山<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">(2)<\/span><span class=\"c-red\">把毛泽东思想确立为党的指导思想并写入党章<\/span><\/p><p class=\"kp-line\"><span class=\"c-orange\">胀气<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">(3)<\/span><span class=\"c-orange\">中共七大把党在长期奋斗中形成的优良作风概括为<\/span><span class=\"c-red\">三<\/span><span class=\"c-red\">大作风<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">(4)<\/span><span class=\"c-red\">标志着我们党在政治上 思想上 组织上走向了成熟<\/span><\/p><p class=\"kp-line\"><span class=\"c-orange\">中共七大三成熟<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">——<\/span><span class=\"c-orange\">在<\/span><span class=\"c-red\">政治<\/span><span class=\"c-orange\">上 党通过延安整风<\/span><\/p><p class=\"kp-line\"><span class=\"c-orange\">使全党团结在毛泽东的旗帜下<\/span><\/p><p class=\"kp-line\"><span class=\"c-orange\">实现了党的<\/span><span class=\"c-red\">空前统一和团结<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">——<\/span><span class=\"c-orange\">在<\/span><span class=\"c-red\">思想<\/span><span class=\"c-orange\">上 党确立了毛泽东<\/span><span class=\"c-red\">思想<\/span><span class=\"c-orange\">在全党的指导地位<\/span><\/p><p class=\"kp-line\"><span class=\"c-orange\">把毛泽东思想写入了党章<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">——<\/span><span class=\"c-orange\">在<\/span><span class=\"c-red\">组织<\/span><span class=\"c-orange\">上<\/span><\/p><p class=\"kp-line\"><span class=\"c-orange\">党形成了一支高举毛泽东旗帜的久经考验的<\/span><span class=\"c-red\">政治家集团<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">(5)<\/span><span class=\"c-orange\">制定了党的<\/span><span class=\"c-red\">政治路线<\/span><span class=\"c-orange\">，<\/span><\/p><p class=\"kp-line\"><span class=\"c-orange\">制定了新民主主义国家在<\/span><span class=\"c-red\">政治、经济、文化方面的纲领<\/span><span class=\"c-orange\">，<\/span><\/p><p class=\"kp-line\"><span class=\"c-orange\">为建立新民主主义的新中国制定了<\/span><span class=\"c-red\">正确路线方针政策<\/span><\/p><p class=\"kp-line\"><span class=\"c-orange\">提出<\/span><span class=\"c-red\">实现中国工业化的宏伟任务<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">(6)<\/span><span class=\"c-orange\">为党后来不断从胜利走向胜利指明了正确方向<\/span><\/p><p class=\"kp-line\"><span class=\"c-orange\">开辟了正确道路<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">七届二中 1949<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">(1)<\/span><span class=\"c-orange\">提出了<\/span><span class=\"c-red\">“两个务必”<\/span><span class=\"c-orange\">的思想：<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">务必<\/span><span class=\"c-orange\">继续保持谦虚、谨慎、不骄、不躁的作风，<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">务必<\/span><span class=\"c-orange\">继续保持艰苦奋斗的作风<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">(2)<\/span><span class=\"c-orange\">指出<\/span><span class=\"c-red\">党的工作重心必须由农村转移到城市<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">(3)<\/span><span class=\"c-red\">规定了党在全国胜利后在政治、经济、外交方面应当<\/span><span class=\"c-red\">采取的基本政策<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">(4)<\/span><span class=\"c-orange\">指出了中国<\/span><span class=\"c-red\">由农业国转变为工业国<\/span><span class=\"c-orange\">、<\/span><span class=\"c-red\">由新民主主义社<\/span><span class=\"c-red\">会转变为社会主义社会<\/span><span class=\"c-orange\">的发展方向<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">中国人民政治协商会议第一届全体会议<\/span><span class=\"c-red\">1949<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">(1)<\/span><span class=\"c-orange\">人民政协的召开，<\/span><span class=\"c-red\">标志着中国的新型政党制度的确立<\/span><\/p><p class=\"kp-line\"><span class=\"c-orange\">——中国共产党领导的多党合作和政治协商制度<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">(2)<\/span><span class=\"c-orange\">会议通过的<\/span><span class=\"c-red\">《共同纲领》在当时是全国人民的大宪章<\/span><span class=\"c-orange\">，起着临时宪法的作用<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">七届三中 1950<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">(1)<\/span><span class=\"c-orange\">制定了党在建国初期的战略策略方针：<\/span><span class=\"c-red\">不要四面出击<\/span><\/p><p class=\"kp-line\"><span class=\"c-orange\">不要四 那就三<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">(2)提出当前阶段<\/span><span class=\"c-orange\">的<\/span><span class=\"c-red\">中心任务<\/span><span class=\"c-orange\">是<\/span><span class=\"c-red\">争取国家财政经济状况的<\/span><span class=\"c-red\">基本好转<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">八大 1956<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">(1)<\/span><span class=\"c-orange\">分析了改造完成后的<\/span><span class=\"c-red\">主要矛盾<\/span><span class=\"c-orange\">和<\/span><span class=\"c-red\">主要任务<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">(2)<\/span><span class=\"c-orange\">在经济建设上，大会坚持既反保守又反冒进，即<\/span><span class=\"c-red\">在综<\/span><span class=\"c-red\">合平衡中稳步前进的方针<\/span><\/p><p class=\"kp-line\"><span class=\"c-orange\">四平八稳<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">(3)<\/span><span class=\"c-orange\">对中国建设社会主义道路的探索，站在<\/span><span class=\"c-red\">比较高的历史<\/span><span class=\"c-red\">起点<\/span><span class=\"c-orange\">上，取得了初步成果<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">八届九中全会<\/span><span class=\"c-red\">1961<\/span><\/p><p class=\"kp-line\"><span class=\"c-orange\">对国民经济实行<\/span><span class=\"c-red\">“调整、巩固、充实、提高”<\/span><span class=\"c-orange\">方针<\/span><\/p>",

   "html": "<p class=\"kp-line\"><span class=\"c-blue\">关于真理标准问题的讨论 1978<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">(1)<\/span><span class=\"c-blue\">真理标准问题的讨论是继五四运动和延安整风运动之后又一场<\/span><span class=\"c-blue\">马<\/span><span class=\"c-blue\">克思主义思想解放运动<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">其实质在于是不是坚持<\/span><span class=\"c-red\">马克思列宁主义 毛泽东思想<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">(2)<\/span><span class=\"c-blue\">讨论明确地<\/span><span class=\"c-blue\">解决了党的思想路线问题<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">(3)<\/span><span class=\"c-blue\">为党重新确立实事求是思想路线 纠正长期以来的左倾错误<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">实现历史性的转折作了<\/span><span class=\"c-blue\">思想理论准备<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">(4)<\/span><span class=\"c-blue\">成为正本清源、拨乱反正和改革开放的<\/span><span class=\"c-blue\">思想先导<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">十一届三中 1978<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">(1)<\/span><span class=\"c-blue\">全会<\/span><span class=\"c-blue\">冲破<\/span><span class=\"c-blue\">长期<\/span><span class=\"c-red\">“左”<\/span><span class=\"c-blue\">的错误的严重束缚，<\/span><span class=\"c-blue\">彻底否定了<\/span><span class=\"c-red\">“两个凡是<\/span><span class=\"c-red\">”<\/span><span class=\"c-blue\">的错误方针<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">高度评价了关于真理标准问题的讨论，并且<\/span><span class=\"c-blue\">断然否定<\/span><span class=\"c-red\">“以阶级斗争<\/span><span class=\"c-red\">为纲”<\/span><span class=\"c-blue\">的指导思想<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">(2)<\/span><span class=\"c-blue\">作出了<\/span><span class=\"c-blue\">把工作重点转移到社会主义现代化建设上来<\/span><span class=\"c-blue\">和<\/span><span class=\"c-blue\">实行改革开<\/span><span class=\"c-blue\">放的<\/span><span class=\"c-blue\">战略决策<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">(3)<\/span><span class=\"c-blue\">重新确立了<\/span><span class=\"c-red\">马克思主义<\/span><span class=\"c-blue\">的思想路线 政治路线和组织路线<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">三线三中<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">/重新确立解放思想，<\/span><span class=\"c-red\">实事求是<\/span><span class=\"c-blue\">思想路线<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">(4)<\/span><span class=\"c-blue\">全会恢复了<\/span><span class=\"c-blue\">党的民主集中制<\/span><span class=\"c-blue\">的优良传统<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">审查解决了历史上遗留的<\/span><span class=\"c-red\">一批重大问题<\/span><span class=\"c-blue\">和<\/span><span class=\"c-red\">一些重要领导人<\/span><span class=\"c-blue\">的功过是<\/span><span class=\"c-blue\">非问题<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">(5)<\/span><span class=\"c-blue\">会议<\/span><span class=\"c-blue\">形成了以邓小平为核心的党的中央领导集体<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">揭开了社会主义改革开放的序幕<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">(6)<\/span><span class=\"c-blue\">以这次全会为起点，<\/span><span class=\"c-blue\">中国进入了改革开放和社会主义现代化建设<\/span><span class=\"c-blue\">的历史新时期<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">(7)<\/span><span class=\"c-blue\">实现了党的历史上<\/span><span class=\"c-blue\">具有深远意义的伟大转折<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">十一届六中《关于建国以来党的若干历史问题的决议》（简称《决<\/span><span class=\"c-blue\">议》）1981<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">邓小平对《决议》的起草提出三条指导原则：<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">第一，<\/span><span class=\"c-blue\">确立<\/span><span class=\"c-red\">毛泽东同志<\/span><span class=\"c-blue\">的历史地位，坚持和发展<\/span><span class=\"c-red\">毛泽东思想<\/span><span class=\"c-blue\">，这是<\/span><span class=\"c-blue\">最<\/span><span class=\"c-red\">核心<\/span><span class=\"c-blue\">的一条<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">第二，对建国30年来历史上的大事，要进行<\/span><span class=\"c-red\">实事求是<\/span><span class=\"c-blue\">的分析，<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">包括一些负责同志的功过是非，要作出公正的评价；<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">第三，这个总结<\/span><span class=\"c-blue\">宜粗不宜细<\/span><span class=\"c-blue\">，总结过去是为了引导大家<\/span><span class=\"c-blue\">团结一致向<\/span><span class=\"c-blue\">前看<\/span><span class=\"c-blue\">。<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">《关于建国以来党的若干历史问题的决议》<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">(1)<\/span><span class=\"c-blue\">标志着党在指导思想上的拨乱反正胜利完成<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">我们党在改革开放和社会主义现代化建设新时期实现的<\/span><span class=\"c-orange\">最根本的<\/span><span class=\"c-orange\">拨乱反正<\/span><span class=\"c-blue\">：<\/span><span class=\"c-blue\">以经济建设为中心<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">(2)<\/span><span class=\"c-blue\">回顾了新中国成立以前党的历史，总结了新中国成立以后社会主<\/span><span class=\"c-blue\">义革命和建设的历史经验。<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">(3)<\/span><span class=\"c-blue\">彻底否定<\/span><span class=\"c-red\">“文化大革命”<\/span><span class=\"c-blue\">，对新中国成立以来的重大历史事件和<\/span><span class=\"c-blue\">重要历史人物作出了基本结论。<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">(4)<\/span><span class=\"c-blue\">科学地评价了<\/span><span class=\"c-red\">毛泽东和毛泽东思想<\/span><span class=\"c-blue\">的历史地位<\/span><span class=\"c-blue\">。<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">对<\/span><span class=\"c-red\">毛泽东思想<\/span><span class=\"c-blue\">的科学体系和活的灵魂作了概括<\/span><span class=\"c-blue\">，<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">强调毛泽东思想是我们党的宝贵的精神财富，它将长期指导我们的<\/span><span class=\"c-blue\">行动。<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">(5)<\/span><span class=\"c-blue\">对党的十一届三中全会以来逐步确立的适合中国情况的建设社会<\/span><span class=\"c-blue\">主义现代化强国的道路，<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">从十个方面作了概括，<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">实质上初步提出了在中国建设什么样的社会主义和怎样建设社会主<\/span><span class=\"c-blue\">义的问题<\/span><span class=\"c-blue\">。<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">(6)<\/span><span class=\"c-blue\">该决议解决了两个相互联系的重大历史课题即<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-blue\">①科学评价毛泽东的历史地位和毛泽东思想的科学体系；<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-blue\">②根据新的实际和发展要求实行改革开放、确立中国社会主义现代<\/span><span class=\"c-blue\">化建设正确道路。<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">(7)<\/span><span class=\"c-blue\">指出社会主义改造基本完成以后，我国所要解决的主要矛盾，<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">是人民日益增长的物质文化需要同落后的社会生产之间的矛盾<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">十二大 1982<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">第一次提出了“<\/span><span class=\"c-blue\">建设有中国特色的社会主义<\/span><span class=\"c-blue\">”命题<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">标志着邓小平理论<\/span><span class=\"c-blue\">主题<\/span><span class=\"c-blue\">的形成，标志着中特理论<\/span><span class=\"c-blue\">主题<\/span><span class=\"c-blue\">的形成<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">从此，“中国特色社会主义”成为我们党的全部理论和实践创新的<\/span><span class=\"c-blue\">主题<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">这一重大命题的提出具有里程碑意义，是中国共产党人对科学社会<\/span><span class=\"c-blue\">主义发展的开创性贡献<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">十二届三中 1984<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">指出我国社会主义经济是在公有制基础上的有计划的商品经济<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">有计划 一二三<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">十三大 1987<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">社会主义初级阶段的基本路线<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">第一次对中特理论进行系统的概括<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">标志着邓小平理论<\/span><span class=\"c-blue\">轮廓<\/span><span class=\"c-blue\">的形成，中特理论<\/span><span class=\"c-blue\">轮廓<\/span><span class=\"c-blue\">的形成<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">基本路线中<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">回答了<\/span><span class=\"c-blue\">社会主义的根本任务问题<\/span><span class=\"c-blue\">的是：<\/span><span class=\"c-blue\">“以经济建设为中心”<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">回答了社会主义的发展动力和外部条件问题：“坚持改革开放”<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">实现奋斗目标的领导力量和依靠力量：“领导和团结各族人民”<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">十四大 1992<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">明确以<\/span><span class=\"c-blue\">建立社会主义市场经济体制<\/span><span class=\"c-blue\">为我国经济体制改革的目标<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">南方谈话和十四大<\/span><span class=\"c-blue\">标志着<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">改革开放和现代化建设事业进入从计划经济体制向社会主义市场经<\/span><span class=\"c-blue\">济体制转变的<\/span><span class=\"c-blue\">新阶段<\/span><span class=\"c-blue\">，<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">由此打开了中国经济、政治、文化发展<\/span><span class=\"c-blue\">崭新局面<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">十五大 1997<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">邓小平理论确立为党的指导思想<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">首次明确提出了社会主义初级阶段的基本<\/span><span class=\"c-blue\">纲领<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">十六大 2002<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">三个代表 小康奋斗目标<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">二三四五六 中路经（过只）刚小乔<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">十七大 2007<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">科学发展观<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">提出了“中国特色社会主义理论体系”的科学概念<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">标志着中国特色社会主义理论和实践的<\/span><span class=\"c-blue\">进一步成熟<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">17-18还需进一步成熟<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">十八三中 2013<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">实现了改革<\/span><span class=\"c-blue\">由局部探索、破冰突围到系统集成、全面深化<\/span><span class=\"c-blue\">的转变，<\/span><span class=\"c-blue\">开创了我国改革开放新局面<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">二十三中 2024<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">进一步全面深化改革的重点是深化经济体制改革<\/span><\/p>",
   "plain": "关于真理标准问题的讨论 1978 (1)真理标准问题的讨论是继五四运动和延安整风运动之后又一场马克思主义思想解放运动 其实质在于是不是坚持马克思列宁主义 毛泽东思想 (2)讨论明确地解决了党的思想路线问题 (3)为党重新确立实事求是思想路线 纠正长期以来的左倾错误 实现历史性的转折作了思想理论准备 (4)成为正本清源、拨乱反正和改革开放的思想先导 十一届三中 1978 (1)全会冲破长期“左”的错误的严重束缚，彻底否定了“两个凡是”的错误方针 高度评价了关于真理标准问题的讨论，并且断然否定“以阶级斗争为纲”的指导思想 (2)作出了把工作重点转移到社会主义现代化建设上来和实行改革开放的战略决策 (3)重新确立了马克思主义的思想路线 政治路线和组织路线 三线三中 /重新确立解放思想，实事求是思想路线 (4)全会恢复了党的民主集中制的优良传统 审查解决了历史上遗留的一批重大问题和一些重要领导人的功过是非问题 (5)会议形成了以邓小平为核心的党的中央领导集体 揭开了社会主义改革开放的序幕 (6)以这次全会为起点，中国进入了改革开放和社会主义现代化建设的历史新时期 (7)实现了党的历史上具有深远意义的伟大转折 十一届六中《关于建国以来党的若干历史问题的决议》（简称《决议》）1981 邓小平对《决议》的起草提出三条指导原则： 第一，确立毛泽东同志的历史地位，坚持和发展毛泽东思想，这是最核心的一条 第二，对建国30年来历史上的大事，要进行实事求是的分析， 包括一些负责同志的功过是非，要作出公正的评价； 第三，这个总结宜粗不宜细，总结过去是为了引导大家团结一致向前看。 《关于建国以来党的若干历史问题的决议》 (1)标志着党在指导思想上的拨乱反正胜利完成 我们党在改革开放和社会主义现代化建设新时期实现的最根本的拨乱反正：以经济建设为中心 (2)回顾了新中国成立以前党的历史，总结了新中国成立以后社会主义革命和建设的历史经验。 (3)彻底否定“文化大革命”，对新中国成立以来的重大历史事件和重要历史人物作出了基本结论。 (4)科学地评价了毛泽东和毛泽东思想的历史地位。 对毛泽东思想的科学体系和活的灵魂作了概括， 强调毛泽东思想是我们党的宝贵的精神财富，它将长期指导我们的行动。 (5)对党的十一届三中全会以来逐步确立的适合中国情况的建设社会主义现代化强国的道路， 从十个方面作了概括， 实质上初步提出了在中国建设什么样的社会主义和怎样建设社会主义的问题。 (6)该决议解决了两个相互联系的重大历史课题即 ①科学评价毛泽东的历史地位和毛泽东思想的科学体系； ②根据新的实际和发展要求实行改革开放、确立中国社会主义现代化建设正确道路。 (7)指出社会主义改造基本完成以后，我国所要解决的主要矛盾， 是人民日益增长的物质文化需要同落后的社会生产之间的矛盾 十二大 1982 第一次提出了“建设有中国特色的社会主义”命题 标志着邓小平理论主题的形成，标志着中特理论主题的形成 从此，“中国特色社会主义”成为我们党的全部理论和实践创新的主题 这一重大命题的提出具有里程碑意义，是中国共产党人对科学社会主义发展的开创性贡献 十二届三中 1984 指出我国社会主义经济是在公有制基础上的有计划的商品经济 有计划 一二三 十三大 1987 社会主义初级阶段的基本路线 第一次对中特理论进行系统的概括 标志着邓小平理论轮廓的形成，中特理论轮廓的形成 基本路线中 回答了社会主义的根本任务问题的是：“以经济建设为中心” 回答了社会主义的发展动力和外部条件问题：“坚持改革开放” 实现奋斗目标的领导力量和依靠力量：“领导和团结各族人民” 十四大 1992 明确以建立社会主义市场经济体制为我国经济体制改革的目标 南方谈话和十四大标志着 改革开放和现代化建设事业进入从计划经济体制向社会主义市场经济体制转变的新阶段， 由此打开了中国经济、政治、文化发展崭新局面 十五大 1997 邓小平理论确立为党的指导思想 首次明确提出了社会主义初级阶段的基本纲领 十六大 2002 三个代表 小康奋斗目标 二三四五六 中路经（过只）刚小乔 十七大 2007 科学发展观 提出了“中国特色社会主义理论体系”的科学概念 标志着中国特色社会主义理论和实践的进一步成熟 17-18还需进一步成熟 十八三中 2013 实现了改革由局部探索、破冰突围到系统集成、全面深化的转变，开创了我国改革开放新局面 二十三中 2024 进一步全面深化改革的重点是深化经济体制改革",

   "html": "<p class=\"kp-line\"><span class=\"c-red\">科比公主<\/span><span class=\"c-blue\">爱打<\/span><span class=\"c-red\">农药<\/span><span class=\"c-blue\">是<\/span><span class=\"c-red\">歌姬<\/span><span class=\"c-blue\">没有<\/span><span class=\"c-red\">福目<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">推动高质量发展的<\/span><span class=\"c-red\">必<\/span><span class=\"c-blue\">由之路—加快实现高水平<\/span><span class=\"c-red\">科<\/span><span class=\"c-blue\">技自立自<\/span><span class=\"c-blue\">强<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">推动高质量发展的<\/span><span class=\"c-red\">主<\/span><span class=\"c-blue\">线—深化<\/span><span class=\"c-red\">供<\/span><span class=\"c-blue\">给侧改革<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">推动高质量发展的<\/span><span class=\"c-blue\">必然<\/span><span class=\"c-red\">要<\/span><span class=\"c-blue\">求—推进<\/span><span class=\"c-red\">农<\/span><span class=\"c-blue\">业现代化<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">推动高质量发展的<\/span><span class=\"c-blue\">战略<\/span><span class=\"c-red\">基<\/span><span class=\"c-blue\">点—加快构建新发展<\/span><span class=\"c-red\">格<\/span><span class=\"c-blue\">局<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">推动高质量发展的<\/span><span class=\"c-blue\">最终<\/span><span class=\"c-red\">目<\/span><span class=\"c-blue\">的—人民幸<\/span><span class=\"c-red\">福<\/span><span class=\"c-blue\">安康<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">高质量现任<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">高质量<\/span><span class=\"c-blue\">发展<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">是全面建设社会主义<\/span><span class=\"c-red\">现<\/span><span class=\"c-blue\">代化国家的首要<\/span><span class=\"c-red\">任<\/span><span class=\"c-blue\">务<\/span><\/p>",
   "plain": "科比公主爱打农药 是歌姬 没有福目 推动高质量发展的必由之路—加快实现高水平科技自立自强 推动高质量发展的主线—深化供给侧改革 推动高质量发展的必然要求—推进农业现代化 推动高质量发展的战略基点—加快构建新发展格局 推动高质量发展的最终目的—人民幸福安康 高质量现任 高质量发展 是全面建设社会主义现代化国家的首要任务",

   "category": "其他",
   "group": "总览",
   "html": "<p class=\"kp-line\"><span class=\"c-red\">事事为<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">法律至上 具体表现为法律的：<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">普遍<\/span><span class=\"c-red\">适<\/span><span class=\"c-blue\">用性<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">优先<\/span><span class=\"c-red\">适<\/span><span class=\"c-blue\">用性<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">不可<\/span><span class=\"c-red\">违<\/span><span class=\"c-blue\">反性<\/span><\/p><p class=\"kp-line\"><span class=\"c-purple\">辨析：<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">普遍<\/span><span class=\"c-blue\">适用性<\/span><span class=\"c-gray\">：<\/span><\/p><p class=\"kp-line\"><span class=\"c-rose\">关键词：所有人、所有机构、所有组织、都必须遵守<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">优先<\/span><span class=\"c-blue\">适用性<\/span><span class=\"c-gray\">：<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">多种规范矛盾<\/span><span class=\"c-orange\">优先考虑法律规范<\/span><span class=\"c-gray\">的适用<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">不可违反<\/span><span class=\"c-blue\">性<\/span><span class=\"c-gray\">：<\/span><\/p><p class=\"kp-line\"><span class=\"c-rose\">不论权力大小、职位高低，<\/span><span class=\"c-gray\">只要有违法行为，就要受<\/span><span class=\"c-orange\">法律<\/span><span class=\"c-orange\">制裁<\/span><\/p>",

   "html": "<p><span class=\"c-blue\">(1)大会<\/span><span class=\"c-orange\">确定党的名称<\/span><span class=\"c-blue\">为“中国共产党”,通过中国共产党<\/span><span class=\"c-blue\">的<\/span><span class=\"c-orange\">第一个纲领<\/span><span class=\"c-blue\">和决议。<\/span><\/p><p><span class=\"c-blue\">(2)大会在讨论实际工作计划时，决定<\/span><span class=\"c-orange\">首先集中精力组织<\/span><span class=\"c-orange\">工人<\/span><\/p><p><span class=\"c-blue\">(3)大会决定设立中央局作为党的临时领导机构。<\/span><\/p>",

   "name": "中共二大 1922",

   "html": "<p><span class=\"c-blue\">(1)第一次提出了<\/span><span class=\"c-orange\">反帝反封建<\/span><span class=\"c-blue\">的民主革命的纲领<\/span><\/p><p><span class=\"c-blue\">(2)开始采取<\/span><span class=\"c-orange\">群众路线<\/span><span class=\"c-blue\">的方法<\/span><\/p><p><span class=\"c-blue\">(3)正式提出<\/span><span class=\"c-orange\">民主联合战线<\/span><span class=\"c-blue\">的主张，<\/span><\/p><p><span class=\"c-blue\">这是党最早提出关于<\/span><span class=\"c-orange\">统一战线<\/span><span class=\"c-blue\">的思想和主张，<\/span><\/p><p><span class=\"c-blue\">主要目的是实现<\/span><span class=\"c-orange\">反帝反军阀<\/span><span class=\"c-blue\">的革命目标<\/span><\/p>",

   "html": "<p><span class=\"c-blue\">(1)对三民主义作出新的解释，即<\/span><span class=\"c-orange\">“新三民主义”<\/span><\/p><p><span class=\"c-blue\">事实上确认了<\/span><span class=\"c-orange\">联俄、联共、扶助农工<\/span><span class=\"c-blue\">的三大革命政策<\/span><\/p><p><span class=\"c-blue\">(2)<\/span><span class=\"c-orange\">新三民主义的政纲同当时中共基本一致，因而成为国<\/span><span class=\"c-orange\">共合作的政治基础<\/span><\/p><p><span class=\"c-blue\">(3)标志着<\/span><span class=\"c-orange\">第一次国共合作正式形成<\/span><\/p>",
   "plain": "(1)对三民主义作出新的解释，即“新三民主义” 事实上确认了联俄、联共、扶助农工的三大革命政策 (2)新三民主义的政纲同当时中共基本一致，因而成为国共合作的政治基础 (3)标志着第一次国共合作正式形成 "
  },
  {
   "name": "中共四大 1925",
   "year": 1925,
   "html": "<p><span class=\"c-blue\">(1)提出了<\/span><span class=\"c-orange\">无产阶级在民主革命中的<\/span><span class=\"c-red\">领导权<\/span><span class=\"c-orange\">问题<\/span><\/p><p><span class=\"c-blue\">(2)提出了<\/span><span class=\"c-orange\">工农联盟<\/span><span class=\"c-blue\">问题<\/span><\/p><p><span class=\"c-blue\">(3)对民主革命的内容作了更加完整的规定<\/span><\/p>",
   "plain": "(1)提出了无产阶级在民主革命中的领导权问题 (2)提出了工农联盟问题 (3)对民主革命的内容作了更加完整的规定 "
  },
  {
   "name": "中共五大 1927",
   "year": 1927,
   "html": "<p><span class=\"c-blue\">(1)提出<\/span><span class=\"c-orange\">争取无产阶级对革命的领导权<\/span><\/p><p><span class=\"c-blue\">(2)建立革命民主政权和实行土地革命等一些正确的原则<\/span><\/p><p><span class=\"c-gray\">但对无产阶级如何争取革命领导权、如何领导农民实<\/span><span class=\"c-gray\">行土地革命,<\/span><\/p><p><span class=\"c-gray\">特别是如何建立党领导的革命武装等问题,没有提出有效<\/span><span class=\"c-gray\">的具体措施,<\/span><\/p><p><span class=\"c-gray\">难以承担起挽救革命的任务。<\/span><\/p>",
   "plain": "(1)提出争取无产阶级对革命的领导权 (2)建立革命民主政权和实行土地革命等一些正确的原则 但对无产阶级如何争取革命领导权、如何领导农民实行土地革命, 特别是如何建立党领导的革命武装等问题,没有提出有效的具体措施, 难以承担起挽救革命的任务。 "

  {
   "name": "八七会议 1927",

   "html": "<p><span class=\"c-blue\">(1)八七会议总结了<\/span><span class=\"c-orange\">大革命失败<\/span><span class=\"c-blue\">的经验教训<\/span><\/p><p><span class=\"c-blue\">巴适<\/span><\/p><p><span class=\"c-blue\">(2)坚决纠正和结束了陈独秀的右倾主义错误<\/span><\/p><p><span class=\"c-blue\">(3)确定了土地革命和武装反抗国民党反动派的总方针<\/span><\/p><p><span class=\"c-blue\">(4)第一次提出了“政权是由枪杆子中取得的”思想<\/span><\/p>",
   "plain": "(1)八七会议总结了大革命失败的经验教训 巴适 (2)坚决纠正和结束了陈独秀的右倾主义错误 (3)确定了土地革命和武装反抗国民党反动派的总方针 (4)第一次提出了“政权是由枪杆子中取得的”思想 "
  },
  {
   "name": "古田会议 1929",

   "html": "<p><span class=\"c-gray\">(1)<\/span><span class=\"c-blue\">真理标准问题的讨论是继五四运动和延安整风运动之后又一场<\/span><span class=\"c-blue\">马<\/span><span class=\"c-blue\">克思主义思想解放运动<\/span><\/p><p><span class=\"c-blue\">其实质在于是不是坚持<\/span><span class=\"c-red\">马克思列宁主义 毛泽东思想<\/span><\/p><p><span class=\"c-gray\">(2)<\/span><span class=\"c-blue\">讨论明确地<\/span><span class=\"c-blue\">解决了党的思想路线问题<\/span><\/p><p><span class=\"c-gray\">(3)<\/span><span class=\"c-blue\">为党重新确立实事求是思想路线 纠正长期以来的左倾错误<\/span><\/p><p><span class=\"c-blue\">实现历史性的转折作了<\/span><span class=\"c-blue\">思想理论准备<\/span><\/p><p><span class=\"c-gray\">(4)<\/span><span class=\"c-blue\">成为正本清源、拨乱反正和改革开放的<\/span><span class=\"c-blue\">思想先导<\/span><\/p>",
   "plain": "(1)真理标准问题的讨论是继五四运动和延安整风运动之后又一场马克思主义思想解放运动 其实质在于是不是坚持马克思列宁主义 毛泽东思想 (2)讨论明确地解决了党的思想路线问题 (3)为党重新确立实事求是思想路线 纠正长期以来的左倾错误 实现历史性的转折作了思想理论准备 (4)成为正本清源、拨乱反正和改革开放的思想先导 "
  },
  {
   "name": "十一届三中 1978",
   "year": 1978,
   "html": "<p><span class=\"c-gray\">(1)<\/span><span class=\"c-blue\">全会<\/span><span class=\"c-blue\">冲破<\/span><span class=\"c-blue\">长期<\/span><span class=\"c-red\">“左”<\/span><span class=\"c-blue\">的错误的严重束缚，<\/span><span class=\"c-blue\">彻底否定了<\/span><span class=\"c-red\">“两个凡是<\/span><span class=\"c-red\">”<\/span><span class=\"c-blue\">的错误方针<\/span><\/p><p><span class=\"c-blue\">高度评价了关于真理标准问题的讨论，并且<\/span><span class=\"c-blue\">断然否定<\/span><span class=\"c-red\">“以阶级斗争<\/span><span class=\"c-red\">为纲”<\/span><span class=\"c-blue\">的指导思想<\/span><\/p><p><span class=\"c-gray\">(2)<\/span><span class=\"c-blue\">作出了<\/span><span class=\"c-blue\">把工作重点转移到社会主义现代化建设上来<\/span><span class=\"c-blue\">和<\/span><span class=\"c-blue\">实行改革开<\/span><span class=\"c-blue\">放的<\/span><span class=\"c-blue\">战略决策<\/span><\/p><p><span class=\"c-gray\">(3)<\/span><span class=\"c-blue\">重新确立了<\/span><span class=\"c-red\">马克思主义<\/span><span class=\"c-blue\">的思想路线 政治路线和组织路线<\/span><\/p><p><span class=\"c-blue\">三线三中<\/span><\/p><p><span class=\"c-blue\">/重新确立解放思想，<\/span><span class=\"c-red\">实事求是<\/span><span class=\"c-blue\">思想路线<\/span><\/p><p><span class=\"c-gray\">(4)<\/span><span class=\"c-blue\">全会恢复了<\/span><span class=\"c-blue\">党的民主集中制<\/span><span class=\"c-blue\">的优良传统<\/span><\/p><p><span class=\"c-blue\">审查解决了历史上遗留的<\/span><span class=\"c-red\">一批重大问题<\/span><span class=\"c-blue\">和<\/span><span class=\"c-red\">一些重要领导人<\/span><span class=\"c-blue\">的功过是<\/span><span class=\"c-blue\">非问题<\/span><\/p><p><span class=\"c-gray\">(5)<\/span><span class=\"c-blue\">会议<\/span><span class=\"c-blue\">形成了以邓小平为核心的党的中央领导集体<\/span><\/p><p><span class=\"c-blue\">揭开了社会主义改革开放的序幕<\/span><\/p><p><span class=\"c-gray\">(6)<\/span><span class=\"c-blue\">以这次全会为起点，<\/span><span class=\"c-blue\">中国进入了改革开放和社会主义现代化建设<\/span><span class=\"c-blue\">的历史新时期<\/span><\/p><p><span class=\"c-gray\">(7)<\/span><span class=\"c-blue\">实现了党的历史上<\/span><span class=\"c-blue\">具有深远意义的伟大转折<\/span><\/p>",
   "plain": "(1)全会冲破长期“左”的错误的严重束缚，彻底否定了“两个凡是”的错误方针 高度评价了关于真理标准问题的讨论，并且断然否定“以阶级斗争为纲”的指导思想 (2)作出了把工作重点转移到社会主义现代化建设上来和实行改革开放的战略决策 (3)重新确立了马克思主义的思想路线 政治路线和组织路线 三线三中 /重新确立解放思想，实事求是思想路线 (4)全会恢复了党的民主集中制的优良传统 审查解决了历史上遗留的一批重大问题和一些重要领导人的功过是非问题 (5)会议形成了以邓小平为核心的党的中央领导集体 揭开了社会主义改革开放的序幕 (6)以这次全会为起点，中国进入了改革开放和社会主义现代化建设的历史新时期 (7)实现了党的历史上具有深远意义的伟大转折 "
  },
  {
   "name": "十一届六中《关于建国以来党的若干历史问题的决议》（简称《决议》）1981",
   "year": 1981,
   "html": "<p><span class=\"c-blue\">邓小平对《决议》的起草提出三条指导原则：<\/span><\/p><p><span class=\"c-blue\">第一，<\/span><span class=\"c-blue\">确立<\/span><span class=\"c-red\">毛泽东同志<\/span><span class=\"c-blue\">的历史地位，坚持和发展<\/span><span class=\"c-red\">毛泽东思想<\/span><span class=\"c-blue\">，这是<\/span><span class=\"c-blue\">最<\/span><span class=\"c-red\">核心<\/span><span class=\"c-blue\">的一条<\/span><\/p><p><span class=\"c-blue\">第二，对建国30年来历史上的大事，要进行<\/span><span class=\"c-red\">实事求是<\/span><span class=\"c-blue\">的分析，<\/span><\/p><p><span class=\"c-blue\">包括一些负责同志的功过是非，要作出公正的评价；<\/span><\/p><p><span class=\"c-blue\">第三，这个总结<\/span><span class=\"c-blue\">宜粗不宜细<\/span><span class=\"c-blue\">，总结过去是为了引导大家<\/span><span class=\"c-blue\">团结一致向<\/span><span class=\"c-blue\">前看<\/span><span class=\"c-blue\">。<\/span><\/p><p><span class=\"c-blue\">《关于建国以来党的若干历史问题的决议》<\/span><\/p><p><span class=\"c-gray\">(1)<\/span><span class=\"c-blue\">标志着党在指导思想上的拨乱反正胜利完成<\/span><\/p><p><span class=\"c-blue\">我们党在改革开放和社会主义现代化建设新时期实现的<\/span><span class=\"c-orange\">最根本的<\/span><span class=\"c-orange\">拨乱反正<\/span><span class=\"c-blue\">：<\/span><span class=\"c-blue\">以经济建设为中心<\/span><\/p><p><span class=\"c-gray\">(2)<\/span><span class=\"c-blue\">回顾了新中国成立以前党的历史，总结了新中国成立以后社会主<\/span><span class=\"c-blue\">义革命和建设的历史经验。<\/span><\/p><p><span class=\"c-gray\">(3)<\/span><span class=\"c-blue\">彻底否定<\/span><span class=\"c-red\">“文化大革命”<\/span><span class=\"c-blue\">，对新中国成立以来的重大历史事件和<\/span><span class=\"c-blue\">重要历史人物作出了基本结论。<\/span><\/p><p><span class=\"c-gray\">(4)<\/span><span class=\"c-blue\">科学地评价了<\/span><span class=\"c-red\">毛泽东和毛泽东思想<\/span><span class=\"c-blue\">的历史地位<\/span><span class=\"c-blue\">。<\/span><\/p><p><span class=\"c-blue\">对<\/span><span class=\"c-red\">毛泽东思想<\/span><span class=\"c-blue\">的科学体系和活的灵魂作了概括<\/span><span class=\"c-blue\">，<\/span><\/p><p><span class=\"c-blue\">强调毛泽东思想是我们党的宝贵的精神财富，它将长期指导我们的<\/span><span class=\"c-blue\">行动。<\/span><\/p><p><span class=\"c-gray\">(5)<\/span><span class=\"c-blue\">对党的十一届三中全会以来逐步确立的适合中国情况的建设社会<\/span><span class=\"c-blue\">主义现代化强国的道路，<\/span><\/p><p><span class=\"c-blue\">从十个方面作了概括，<\/span><\/p><p><span class=\"c-blue\">实质上初步提出了在中国建设什么样的社会主义和怎样建设社会主<\/span><span class=\"c-blue\">义的问题<\/span><span class=\"c-blue\">。<\/span><\/p><p><span class=\"c-gray\">(6)<\/span><span class=\"c-blue\">该决议解决了两个相互联系的重大历史课题即<\/span><\/p><p><span class=\"c-blue\">①科学评价毛泽东的历史地位和毛泽东思想的科学体系；<\/span><\/p><p><span class=\"c-blue\">②根据新的实际和发展要求实行改革开放、确立中国社会主义现代<\/span><span class=\"c-blue\">化建设正确道路。<\/span><\/p><p><span class=\"c-gray\">(7)<\/span><span class=\"c-blue\">指出社会主义改造基本完成以后，我国所要解决的主要矛盾，<\/span><\/p><p><span class=\"c-blue\">是人民日益增长的物质文化需要同落后的社会生产之间的矛盾<\/span><\/p>",
   "plain": "邓小平对《决议》的起草提出三条指导原则： 第一，确立毛泽东同志的历史地位，坚持和发展毛泽东思想，这是最核心的一条 第二，对建国30年来历史上的大事，要进行实事求是的分析， 包括一些负责同志的功过是非，要作出公正的评价； 第三，这个总结宜粗不宜细，总结过去是为了引导大家团结一致向前看。 《关于建国以来党的若干历史问题的决议》 (1)标志着党在指导思想上的拨乱反正胜利完成 我们党在改革开放和社会主义现代化建设新时期实现的最根本的拨乱反正：以经济建设为中心 (2)回顾了新中国成立以前党的历史，总结了新中国成立以后社会主义革命和建设的历史经验。 (3)彻底否定“文化大革命”，对新中国成立以来的重大历史事件和重要历史人物作出了基本结论。 (4)科学地评价了毛泽东和毛泽东思想的历史地位。 对毛泽东思想的科学体系和活的灵魂作了概括， 强调毛泽东思想是我们党的宝贵的精神财富，它将长期指导我们的行动。 (5)对党的十一届三中全会以来逐步确立的适合中国情况的建设社会主义现代化强国的道路， 从十个方面作了概括， 实质上初步提出了在中国建设什么样的社会主义和怎样建设社会主义的问题。 (6)该决议解决了两个相互联系的重大历史课题即 ①科学评价毛泽东的历史地位和毛泽东思想的科学体系； ②根据新的实际和发展要求实行改革开放、确立中国社会主义现代化建设正确道路。 (7)指出社会主义改造基本完成以后，我国所要解决的主要矛盾， 是人民日益增长的物质文化需要同落后的社会生产之间的矛盾 "
  },

   "html": "<p><span class=\"c-blue\">第一次提出了“<\/span><span class=\"c-blue\">建设有中国特色的社会主义<\/span><span class=\"c-blue\">”命题<\/span><\/p><p><span class=\"c-blue\">标志着邓小平理论<\/span><span class=\"c-blue\">主题<\/span><span class=\"c-blue\">的形成，标志着中特理论<\/span><span class=\"c-blue\">主题<\/span><span class=\"c-blue\">的形成<\/span><\/p><p><span class=\"c-blue\">从此，“中国特色社会主义”成为我们党的全部理论和实践创新的<\/span><span class=\"c-blue\">主题<\/span><\/p><p><span class=\"c-blue\">这一重大命题的提出具有里程碑意义，是中国共产党人对科学社会<\/span><span class=\"c-blue\">主义发展的开创性贡献<\/span><\/p>",

   "year": 1987,
   "html": "<p><span class=\"c-blue\">社会主义初级阶段的基本路线<\/span><\/p><p><span class=\"c-blue\">第一次对中特理论进行系统的概括<\/span><\/p><p><span class=\"c-blue\">标志着邓小平理论<\/span><span class=\"c-blue\">轮廓<\/span><span class=\"c-blue\">的形成，中特理论<\/span><span class=\"c-blue\">轮廓<\/span><span class=\"c-blue\">的形成<\/span><\/p><p><span class=\"c-blue\">基本路线中<\/span><\/p><p><span class=\"c-blue\">回答了<\/span><span class=\"c-blue\">社会主义的根本任务问题<\/span><span class=\"c-blue\">的是：<\/span><span class=\"c-blue\">“以经济建设为中心”<\/span><\/p><p><span class=\"c-blue\">回答了社会主义的发展动力和外部条件问题：“坚持改革开放”<\/span><\/p><p><span class=\"c-blue\">实现奋斗目标的领导力量和依靠力量：“领导和团结各族人民”<\/span><\/p>",
   "plain": "社会主义初级阶段的基本路线 第一次对中特理论进行系统的概括 标志着邓小平理论轮廓的形成，中特理论轮廓的形成 基本路线中 回答了社会主义的根本任务问题的是：“以经济建设为中心” 回答了社会主义的发展动力和外部条件问题：“坚持改革开放” 实现奋斗目标的领导力量和依靠力量：“领导和团结各族人民” "
