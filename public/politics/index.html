   "no": 1,
   "title": "马恩第一个无产阶级政党",
   "category": "马原",
   "group": "基本知识",
   "html": "<p class=\"kp-line\"><span class=\"c-blue\">马克思和恩格斯建立的<\/span><span class=\"c-orange\">第一个无产阶级政党<\/span><span class=\"c-blue\">：<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">共产主义者同盟<\/span><\/p>",
   "plain": "马克思和恩格斯建立的第一个无产阶级政党： 共产主义者同盟",
   "page": 11
  },
  {
   "no": 2,
   "title": "马克思主义",
   "category": "马原",
   "group": "基本知识",
   "html": "<p class=\"kp-line\"><span class=\"c-gray\">马克思主义的<\/span><span class=\"c-blue\">本质<\/span><span class=\"c-gray\">属性：<\/span><span class=\"c-red\">人民性<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">马克思主义理论区别于其他理论的<\/span><span class=\"c-blue\">根本<\/span><span class=\"c-gray\">特征：<\/span><span class=\"c-red\">实践<\/span><span class=\"c-gray\">性<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">马克思主义新世界观创立的<\/span><span class=\"c-blue\">关键<\/span><span class=\"c-gray\">在于<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">马克思确立了科学的<\/span><span class=\"c-red\">实践<\/span><span class=\"c-gray\">观<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">马克思主义的<\/span><span class=\"c-blue\">基本特征<\/span><span class=\"c-gray\">一句话概括：<\/span><\/p><p class=\"kp-line\"><span class=\"c-purple\">科<\/span><span class=\"c-blue\">学性与革<\/span><span class=\"c-orange\">命<\/span><span class=\"c-blue\">性的统一<\/span><span class=\"c-gray\">（<\/span><span class=\"c-purple\">科<\/span><span class=\"c-orange\">命<\/span><span class=\"c-gray\">）<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">马克思主义之所以 “<\/span><span class=\"c-blue\">彳亍<\/span><span class=\"c-gray\">”, 根本原因在于<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">马克思主义是<\/span><span class=\"c-red\">科学<\/span><span class=\"c-gray\">的世界观和方法论<\/span><\/p>",
   "plain": "马克思主义的本质属性：人民性 马克思主义理论区别于其他理论的根本特征：实践性 马克思主义新世界观创立的关键在于 马克思确立了科学的实践观 马克思主义的基本特征一句话概括： 科学性与革命性的统一（科命） 马克思主义之所以 “彳亍”, 根本原因在于 马克思主义是科学的世界观和方法论",
   "page": 11
  },
  {
   "no": 3,
   "title": "上层建筑",
   "category": "马原",
   "group": "基本知识",
   "html": "<p class=\"kp-line\"><span class=\"c-blue\">政治上层建筑<\/span><span class=\"c-red\">（主导地位）<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">政治上层建筑的<\/span><span class=\"c-red\">核心<\/span><span class=\"c-gray\">：<\/span><span class=\"c-blue\">国家政权<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">观念上层建筑<\/span><span class=\"c-blue\">（意识形态）<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">在意识形态中居于<\/span><span class=\"c-red\">核心<\/span><span class=\"c-gray\">地位，起<\/span><span class=\"c-red\">主导<\/span><span class=\"c-gray\">作用的是<\/span><span class=\"c-blue\">政治法律思<\/span><span class=\"c-blue\">想<\/span><\/p>",
   "plain": "政治上层建筑（主导地位） 政治上层建筑的核心：国家政权 观念上层建筑（意识形态） 在意识形态中居于核心地位，起主导作用的是政治法律思想",
   "page": 11
  },
  {
   "no": 4,
   "title": "人的本质",
   "category": "马原",
   "group": "基本知识",
   "html": "<p class=\"kp-line\"><span class=\"c-gray\">人的<\/span><span class=\"c-red\">本质<\/span><span class=\"c-gray\">是<\/span><span class=\"c-blue\">一切社会<\/span><span class=\"c-red\">关系<\/span><span class=\"c-blue\">的总和<\/span><\/p>",
   "plain": "人的本质是一切社会关系的总和",
   "page": 11
  },
  {
   "no": 5,
   "title": "两个理论辨析",
   "category": "马原",
   "group": "基本知识",
   "html": "<p class=\"kp-line\"><span class=\"c-blue\">理解政治经济学的<\/span><span class=\"c-purple\">枢纽<\/span><span class=\"c-blue\">：<\/span><\/p><p class=\"kp-line\"><span class=\"c-purple\">劳<\/span><span class=\"c-orange\">动<\/span><span class=\"c-purple\">二<\/span><span class=\"c-orange\">重性理论<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">马克思经济学说的核心内容和<\/span><span class=\"c-red\">基石<\/span><span class=\"c-blue\">是：<\/span><\/p><p class=\"kp-line\"><span class=\"c-orange\">剩余价值理论<\/span><\/p><p class=\"kp-line\"><span class=\"c-purple\">牢二枢纽剩余基<\/span><\/p>",
   "plain": "理解政治经济学的枢纽： 劳动二重性理论 马克思经济学说的核心内容和基石是： 剩余价值理论 牢二枢纽剩余基",
   "page": 11
  },
  {
   "no": 6,
   "title": "唯物史观和剩余价值学说",
   "category": "马原",
   "group": "基本知识",
   "html": "<p class=\"kp-line\"><span class=\"c-blue\">社会主义由空想变为科学的<\/span><span class=\"c-orange\">两大基石<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">/马克思一生的两个伟大发现：<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">唯物史观和剩余价值学说<\/span><\/p>",
   "plain": "社会主义由空想变为科学的两大基石 /马克思一生的两个伟大发现： 唯物史观和剩余价值学说",
   "page": 11
  },
  {
   "no": 7,
   "title": "实践",
   "category": "马原",
   "group": "基本知识",
   "html": "<p class=\"kp-line\"><span class=\"c-blue\">实践之所以成为检验真理的唯一标准<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">/实践高于理论的认识<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">是因为实践具有<\/span><span class=\"c-red\">直接现实性<\/span><\/p>",
   "plain": "实践之所以成为检验真理的唯一标准 /实践高于理论的认识 是因为实践具有直接现实性",
   "page": 11
  },
  {
   "no": 8,
   "title": "物质世界的二重化",
   "category": "马原",
   "group": "基本知识",
   "html": "<p class=\"kp-line\"><span class=\"c-gray\">物质世界的二重化指的是，<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">人类改造世界的实践活动使世界发生了二重分化，<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">即<\/span><span class=\"c-blue\">从自然界中分化出人类社会<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">从客观世界中分化出主观世界<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">人类实践使世界二重化为<\/span><span class=\"c-gray\">现实<\/span><span class=\"c-gray\">世界与虚拟世界<\/span><\/p>",
   "plain": "物质世界的二重化指的是， 人类改造世界的实践活动使世界发生了二重分化， 即从自然界中分化出人类社会 从客观世界中分化出主观世界 人类实践使世界二重化为现实世界与虚拟世界",
   "page": 11
  },
  {
   "no": 9,
   "title": "科学社会主义的核心命题",
   "category": "马原",
   "group": "基本知识",
   "html": "<p class=\"kp-line\"><span class=\"c-red\">是2必<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">是资本主义<\/span><span class=\"c-red\">必<\/span><span class=\"c-blue\">然灭亡<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">社会主义<\/span><span class=\"c-red\">必<\/span><span class=\"c-blue\">然胜利<\/span><\/p>",
   "plain": "是2必 是资本主义必然灭亡 社会主义必然胜利",
   "page": 11
  },
  {
   "no": 10,
   "title": "六个寓于",
   "category": "马原",
   "group": "基本知识",
   "html": "<p class=\"kp-line\"><span class=\"c-red\">价<\/span><span class=\"c-blue\">值<\/span><span class=\"c-red\">寓<\/span><span class=\"c-blue\">于使用价值之中<\/span><span class=\"c-orange\">（J&gt;S）<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">必<\/span><span class=\"c-blue\">然性<\/span><span class=\"c-red\">寓<\/span><span class=\"c-blue\">于偶然性之中<\/span><span class=\"c-orange\">（B&gt;O）<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">斗<\/span><span class=\"c-blue\">争性<\/span><span class=\"c-red\">寓<\/span><span class=\"c-blue\">于同一性之中<\/span><span class=\"c-orange\">（D&gt;T）<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">绝<\/span><span class=\"c-blue\">对性<\/span><span class=\"c-red\">寓<\/span><span class=\"c-blue\">于相对性质中<\/span><span class=\"c-orange\">（J&gt;X）<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">普<\/span><span class=\"c-blue\">遍性<\/span><span class=\"c-red\">寓<\/span><span class=\"c-blue\">于特殊性之中<\/span><span class=\"c-orange\">（P&gt;T）<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">共<\/span><span class=\"c-blue\">性<\/span><span class=\"c-red\">寓<\/span><span class=\"c-blue\">于个性之中<\/span><span class=\"c-orange\">（G=G）<\/span><\/p><p class=\"kp-line\">比如：资本主义的运行规律（特殊性）寓于人类社会发展的一般规律（普遍性）之中<\/p>",
   "plain": "价值寓于使用价值之中（J>S） 必然性寓于偶然性之中（B>O） 斗争性寓于同一性之中（D>T） 绝对性寓于相对性质中（J>X） 普遍性寓于特殊性之中（P>T） 共性寓于个性之中（G=G） 比如：资本主义的运行规律（特殊性）寓于人类社会发展的一般规律（普遍性）之中",
   "page": 12
  },
  {
   "no": 11,
   "title": "自由",
   "category": "马原",
   "group": "基本知识",
   "html": "<p class=\"kp-line\"><span class=\"c-gray\">只用记住<\/span><span class=\"c-orange\">根本<\/span><span class=\"c-gray\">对应<\/span><span class=\"c-red\">自由<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">以下是几个具体表述：<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">马克思主义追求的<\/span><span class=\"c-orange\">根本<\/span><span class=\"c-gray\">价值目标/共产主义社会的<\/span><span class=\"c-orange\">根本<\/span><span class=\"c-gray\">特征/<\/span><span class=\"c-blue\">现代化的最终目标<\/span><span class=\"c-gray\">：实现人的<\/span><span class=\"c-red\">自由<\/span><span class=\"c-gray\">全面的发展<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">人类认识世界和改造世界的<\/span><span class=\"c-orange\">根本<\/span><span class=\"c-gray\">目标：认识必然和争<\/span><span class=\"c-gray\">取<\/span><span class=\"c-red\">自由<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">人的发展最<\/span><span class=\"c-orange\">根本<\/span><span class=\"c-gray\">的是人的<\/span><span class=\"c-red\">自由<\/span><span class=\"c-gray\">程度的提高<\/span><\/p>",
   "plain": "只用记住根本对应自由 以下是几个具体表述： 马克思主义追求的根本价值目标/共产主义社会的根本特征/现代化的最终目标：实现人的自由全面的发展 人类认识世界和改造世界的根本目标：认识必然和争取自由 人的发展最根本的是人的自由程度的提高",
   "page": 12
  },
  {
   "no": 12,
   "title": "人类认识",
   "category": "马原",
   "group": "基本知识",
   "html": "<p class=\"kp-line\"><span class=\"c-gray\">人类认识包括知识性认识与评价性认识两个方面<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">知识性认识<\/span><span class=\"c-gray\">以客观事物及其规律为对象<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">以<\/span><span class=\"c-blue\">客体本身的属性<\/span><span class=\"c-gray\">、关系和发展过程为反映内容<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">追求客体“是什么”，以求“<\/span><span class=\"c-blue\">真<\/span><span class=\"c-gray\">”为认识目的<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">评价性认识<\/span><span class=\"c-gray\">即<\/span><span class=\"c-orange\">价值评价<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">价值评价以<\/span><span class=\"c-blue\">客体和主体之间的价值关系<\/span><span class=\"c-gray\">为反映内容<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">主体的意向、愿望和要求包含在其中<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">追求“应该怎样”，以求“<\/span><span class=\"c-blue\">善<\/span><span class=\"c-gray\">”和“<\/span><span class=\"c-blue\">美<\/span><span class=\"c-gray\">”为认识目的<\/span><\/p><p class=\"kp-line\"><span class=\"c-rose\">评价结果有正确与错误之分<\/span><\/p><p class=\"kp-line\"><span class=\"c-rose\">价值评价也有科学与非科学之别<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">人生价值评价<\/span><span class=\"c-gray\">主要是看一个人的人生活动是否符合社<\/span><span class=\"c-gray\">会的客观规律,其评价的<\/span><span class=\"c-blue\">根本尺度<\/span><span class=\"c-gray\">是<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">历史标准<\/span><\/p>",
   "plain": "人类认识包括知识性认识与评价性认识两个方面 知识性认识以客观事物及其规律为对象 以客体本身的属性、关系和发展过程为反映内容 追求客体“是什么”，以求“真”为认识目的 评价性认识即价值评价 价值评价以客体和主体之间的价值关系为反映内容 主体的意向、愿望和要求包含在其中 追求“应该怎样”，以求“善”和“美”为认识目的 评价结果有正确与错误之分 价值评价也有科学与非科学之别 人生价值评价主要是看一个人的人生活动是否符合社会的客观规律,其评价的根本尺度是 历史标准",
   "page": 12
  },
  {
   "no": 13,
   "title": "马克思主义相关著作",
   "category": "马原",
   "group": "基本知识",
   "html": "<p class=\"kp-line\"><span class=\"c-blue\">《<\/span><span class=\"c-red\">德法<\/span><span class=\"c-blue\">年鉴》完成了从唯心主义向唯物主义<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">从革命民主主义向共产主义的<\/span><span class=\"c-red\">转变<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">为创立马克思主义奠定了思想前提<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">德法两转变<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">《神圣<\/span><span class=\"c-red\">家族<\/span><span class=\"c-blue\">》是<\/span><span class=\"c-red\">马<\/span><span class=\"c-blue\">克思<\/span><span class=\"c-red\">恩<\/span><span class=\"c-blue\">格斯合著的<\/span><span class=\"c-red\">第一<\/span><span class=\"c-blue\">部著作<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">批判黑格尔维新 论述历史唯物<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">马恩第一家族<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">《<\/span><span class=\"c-red\">德<\/span><span class=\"c-blue\">意志意识形态》首次系统阐述了<\/span><span class=\"c-red\">历史<\/span><span class=\"c-blue\">唯物主义的基本<\/span><span class=\"c-blue\">观点<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">德历史<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">《<\/span><span class=\"c-red\">共<\/span><span class=\"c-blue\">产党宣言》发表标志着马克思主义的<\/span><span class=\"c-red\">公<\/span><span class=\"c-blue\">开问世<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">公共<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">《<\/span><span class=\"c-red\">资<\/span><span class=\"c-blue\">本论》被称为“<\/span><span class=\"c-red\">工<\/span><span class=\"c-blue\">人阶级的圣经”<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">工资<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">《<\/span><span class=\"c-red\">法<\/span><span class=\"c-blue\">兰西内战》科学总结了<\/span><span class=\"c-red\">巴黎<\/span><span class=\"c-blue\">公社的历史经验<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">法<\/span><span class=\"c-blue\">国<\/span><span class=\"c-red\">巴黎<\/span><\/p><p class=\"kp-line\"><span clas    "plain": "《德法年鉴》完成了从唯心主义向唯物主义 从革命民主主义向共产主义的转变 为创立马克思主义奠定了思想前提 德法两转变 《神圣家族》是马克思恩格斯合著的第一部著作 批判黑格尔维新 论述历史唯物 马恩第一家族 《德意志意识形态》首次系统阐述了历史唯物主义的基本观点 德历史 《共产党宣言》发表标志着马克思主义的公开问世 公共 《资本论》被称为“工人阶级的圣经” 工资 《法兰西内战》科学总结了巴黎公社的历史经验 法国巴黎 《哥达纲领批判》对未来社会从制度 发展阶段以及分配等方面作了原则构想 哥够香 《反杜林论》全面阐述了马克思主义理论体系 被称为马克思主义的“百科全书” 全面反杜林 《关于费尔巴哈的提纲》马克思科学阐明了人类实践的本质和作用，首次提出科学的实践观 实践费",

   "no": 14,
   "title": "资本主义的新变化-二战后",
   "category": "马原",
   "group": "资本主义及垄断",
   "html": "<p class=\"kp-line\"><span class=\"c-gray\">当今资本主义社会居<\/span><span class=\"c-red\">主导地位<\/span><span class=\"c-gray\">的资本所有制形式是<\/span><span class=\"c-blue\">法<\/span><span class=\"c-blue\">人资本所有制<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">私人<\/span><span class=\"c-orange\">股份<\/span><span class=\"c-gray\">所有制：所有权和控制权不再统一<\/span><\/p><p class=\"kp-line\"><span class=\"c-orange\">法人<\/span><span class=\"c-gray\">资本所有制：法人狠狠独揽大权<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">法人资本所有制主要特点是资本占有主体多元化，公司资<\/span><span class=\"c-gray\">本的所有权与控制权不再统一<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">劳资关系和分配关系<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">职工参与决<\/span><span class=\"c-rose\">策<\/span><span class=\"c-gray\">、<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">终身<\/span><span class=\"c-rose\">雇<\/span><span class=\"c-gray\">佣、<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">职工持<\/span><span class=\"c-rose\">股<\/span><span class=\"c-gray\">、<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">社会福利的普及化与全<\/span><span class=\"c-rose\">民<\/span><span class=\"c-gray\">化<\/span><\/p><p class=\"kp-line\"><span class=\"c-rose\">策雇股民<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">社会阶层和阶级结构<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">有所有权的资本家一般不再直接经营和管理企业<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">高级职业经理<\/span><span class=\"c-blue\">成为大公司经营活动的<\/span><span class=\"c-orange\">实际控制者<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">知识型和服务型劳动者的数量不断增加，劳动方式发<\/span><span class=\"c-gray\">生了新变化<\/span><\/p>",
   "plain": "当今资本主义社会居主导地位的资本所有制形式是法人资本所有制 私人股份所有制：所有权和控制权不再统一 法人资本所有制：法人狠狠独揽大权 法人资本所有制主要特点是资本占有主体多元化，公司资本的所有权与控制权不再统一 劳资关系和分配关系 职工参与决策、 终身雇佣、 职工持股、 社会福利的普及化与全民化 策雇股民 社会阶层和阶级结构 有所有权的资本家一般不再直接经营和管理企业 高级职业经理成为大公司经营活动的实际控制者 知识型和服务型劳动者的数量不断增加，劳动方式发生了新变化",

   "title": "资本主义的新变化-当代",
   "category": "马原",
   "group": "资本主义及垄断",
   "html": "<p class=\"kp-line\"><span class=\"c-blue\">当代资本主义最突出、最鲜明、最主要的特征是：<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">国际金融资本的垄断<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">国际金融垄断资本主义影响日益显现，主要表现在：<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">金融垄断寡<\/span><span class=\"c-rose\">头<\/span><span class=\"c-gray\">化、<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">金融垄断国<\/span><span class=\"c-rose\">际<\/span><span class=\"c-gray\">化<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">经济<\/span><span class=\"c-rose\">虚<\/span><span class=\"c-gray\">拟化产业空<\/span><span class=\"c-rose\">心<\/span><span class=\"c-gray\">化<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">空心瓜果<\/span><\/p><p class=\"kp-line\"><span class=\"c-rose\">空虚<\/span><span class=\"c-gray\">的<\/span><span class=\"c-rose\">国<\/span><span class=\"c-gray\">际<\/span><span class=\"c-rose\">寡<\/span><span class=\"c-gray\">妇<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">偷鸡<\/span><span class=\"c-rose\">心虚/虚空<\/span><span class=\"c-blue\">鸡头（你干嘛 哎哟）<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">金融垄断资本形成<\/span><span class=\"c-orange\">壮大<\/span><span class=\"c-gray\">的重要制度条件：<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">金融<\/span><span class=\"c-red\">自由<\/span><span class=\"c-blue\">化<\/span><span class=\"c-gray\">与<\/span><span class=\"c-blue\">金融<\/span><span class=\"c-red\">创新<\/span><\/p>",
   "plain": "当代资本主义最突出、最鲜明、最主要的特征是： 国际金融资本的垄断 国际金融垄断资本主义影响日益显现，主要表现在： 金融垄断寡头化、 金融垄断国际化 经济虚拟化产业空心化 空心瓜果 空虚的国际寡妇 偷鸡心虚/虚空鸡头（你干嘛 哎哟） 金融垄断资本形成壮大的重要制度条件： 金融自由化与金融创新",

   "plain": "影响资本周转快慢的因素有很多 关键的因素有两个： 资本周转的时间 生产资本的固定资本和流动资本的构成 狗屎",
   "page": 14
  },
  {
   "no": 24,
   "title": "资本积累",
   "category": "马原",
   "group": "政经",
   "html": "<p class=\"kp-line\"><span class=\"c-blue\">剩余价值<\/span><span class=\"c-gray\">是<\/span><span class=\"c-orange\">资本积累<\/span><span class=\"c-blue\">的唯一源泉<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">资本积累<\/span><span class=\"c-gray\">是<\/span><span class=\"c-orange\">资本主义扩大再生产<\/span><span class=\"c-blue\">的源泉<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">资本积累导致了资本主义<\/span><span class=\"c-blue\">社会的两极分化<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">资本积累的扩大会导致资本有机构成提高进而产生<\/span><span class=\"c-blue\">失业问<\/span><span class=\"c-blue\">题<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">焚诀：<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">资本有机构成一直在增加，看到选项说减少的就是错的<\/span><\/p>",
   "plain": "剩余价值是资本积累的唯一源泉 资本积累是资本主义扩大再生产的源泉 资本积累导致了资本主义社会的两极分化 资本积累的扩大会导致资本有机构成提高进而产生失业问题 焚诀： 资本有机构成一直在增加，看到选项说减少的就是错的",
   "page": 14

  {
   "no": 25,
   "title": "私人劳动和社会劳动",
   "category": "马原",
   "group": "政经",
   "html": "<p class=\"kp-line\"><span class=\"c-red\">资本主义的基本矛盾：<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">生产社会化和生产资料资本主义私人占有之间的矛盾<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">私有制基础上商品经济的基本矛盾：<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">私人劳动和社会劳动的矛盾<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">决定着商品经济的本质及发展过程<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">商品经济其他一切矛盾的基础<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">决定着商品生产者的命运<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">马克思劳动价值论<\/span><span class=\"c-orange\">揭示了商品经济的基本矛盾<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">商品的使用价值和价值的矛盾、<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">生产商品的具体劳动和抽象劳动的矛盾，<\/span><\/p><p class=\"kp-line\"><span class=\"c-rose\">根源于<\/span><span class=\"c-blue\">私人劳动和社会劳动的矛盾<\/span><span class=\"c-gray\">。<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">商品生产者的劳动的社会性质是<\/span><span class=\"c-red\">由社会分工决定的<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">具体劳动能否还原为抽象劳动，在根本上取决于<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">私人劳动和社会劳动能否实现统一<\/span><\/p>",
   "plain": "资本主义的基本矛盾： 生产社会化和生产资料资本主义私人占有之间的矛盾 私有制基础上商品经济的基本矛盾： 私人劳动和社会劳动的矛盾 决定着商品经济的本质及发展过程 商品经济其他一切矛盾的基础 决定着商品生产者的命运 马克思劳动价值论揭示了商品经济的基本矛盾 商品的使用价值和价值的矛盾、 生产商品的具体劳动和抽象劳动的矛盾， 根源于私人劳动和社会劳动的矛盾。 商品生产者的劳动的社会性质是由社会分工决定的 具体劳动能否还原为抽象劳动，在根本上取决于 私人劳动和社会劳动能否实现统一",
   "page": 14
  },
  {
   "no": 26,
   "title": "社会生产",
   "category": "马原",
   "group": "政经",
   "html": "<p class=\"kp-line\"><span class=\"c-gray\">在社会生产中，<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">【<\/span><span class=\"c-red\">生产力<\/span><span class=\"c-gray\">】是生产的【<\/span><span class=\"c-blue\">物质内容<\/span><span class=\"c-gray\">】，<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">【<\/span><span class=\"c-red\">生产关系<\/span><span class=\"c-gray\">】是生产的【<\/span><span class=\"c-blue\">社会形式<\/span><span class=\"c-gray\">】，<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">二者构成<\/span><span class=\"c-gray\">【<\/span><span class=\"c-red\">社会的生产方式<\/span><span class=\"c-gray\">】。<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">社会形态更替<\/span><span class=\"c-orange\">归根结底<\/span><span class=\"c-blue\">是【<\/span><span class=\"c-orange\">社会基本矛盾<\/span><span class=\"c-blue\">运动】的结果<\/span><span class=\"c-gray\">，<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">其中，<\/span><span class=\"c-red\">生产力的发展<\/span><span class=\"c-blue\">具有最终的决定意义<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">社会历史发展的<\/span><span class=\"c-rose\">根本<\/span><span class=\"c-blue\">动力：<\/span><span class=\"c-rose\">社会基本矛盾<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">资本主义经济危机具有周期性<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">这是由<\/span><span class=\"c-rose\">资本主义基本矛盾运动的阶段性决定<\/span><span class=\"c-gray\">的<\/span><\/p>",
   "plain": "在社会生产中， 【生产力】是生产的【物质内容】， 【生产关系】是生产的【社会形式】， 二者构成【社会的生产方式】。 社会形态更替归根结底是【社会基本矛盾运动】的结果， 其中， 生产力的发展具有最终的决定意义 社会历史发展的根本动力：社会基本矛盾 资本主义经济危机具有周期性 这是由资本主义基本矛盾运动的阶段性决定的",
   "page": 14

  {
   "no": 27,
   "title": "货币的本质和职能",
   "category": "马原",
   "group": "政经",
   "html": "<p class=\"kp-line\"><span class=\"c-gray\">货币的本质:<\/span><span class=\"c-blue\">固定充当一般等价物的商品<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">货币的五种基本职能:<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">①<\/span><span class=\"c-blue\">价值尺度<\/span><span class=\"c-gray\">：观念中的货币。（关键词：标价）<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">②<\/span><span class=\"c-blue\">流通手段<\/span><span class=\"c-gray\">：即时交易。（关键词：买）<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">③<\/span><span class=\"c-blue\">贮藏手段<\/span><span class=\"c-gray\">：贮存。（关键词：必须是足值的货币）<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">④<\/span><span class=\"c-blue\">支付手段<\/span><span class=\"c-gray\">：提前或延后交易。（关键词：<\/span><span class=\"c-blue\">债务 赋税<\/span><span class=\"c-blue\">工资 租金<\/span><span class=\"c-gray\">）<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">⑤<\/span><span class=\"c-blue\">世界货币<\/span><span class=\"c-gray\">：货币职能在世界范围内的扩展。（关键词<\/span><span class=\"c-gray\">：汇率）<\/span><\/p><p class=\"kp-line\"><span class=\"c-orange\">货币最基本的职能<\/span><span class=\"c-gray\">：<\/span><span class=\"c-red\">价<\/span><span class=\"c-blue\">值尺度<\/span><span class=\"c-gray\">和<\/span><span class=\"c-red\">流<\/span><span class=\"c-blue\">通手段<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">是“甲流”<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">经济危机的抽象的一般的可能性首先是由<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">货币作为<\/span><span class=\"c-rose\">流通手段和支付手段<\/span><span class=\"c-gray\">引起的<\/span><\/p>",
   "plain": "货币的本质: 固定充当一般等价物的商品 货币的五种基本职能: ① 价值尺度：观念中的货币。（关键词：标价） ② 流通手段：即时交易。（关键词：买） ③ 贮藏手段：贮存。（关键词：必须是足值的货币） ④ 支付手段：提前或延后交易。（关键词：债务 赋税工资 租金） ⑤ 世界货币：货币职能在世界范围内的扩展。（关键词：汇率） 货币最基本的职能：价值尺度和流通手段 是“甲流” 经济危机的抽象的一般的可能性首先是由 货币作为流通手段和支付手段引起的",
   "page": 15
  },
  {
   "no": 28,
   "title": "价值规律的作用",
   "category": "马原",
   "group": "政经",
   "html": "<p class=\"kp-line\"><span class=\"c-gray\">价值规律在市场配置资源过程中的作用表现在：<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-blue\">(1)自发地调节生产资料和劳动力在社会各生产部门之间<\/span><span class=\"c-blue\">的分配比例<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-blue\">(2)自发地刺激社会生产力的发展<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-blue\">(3)自发地调节社会收入的分配<\/span><\/p><p class=\"kp-line\"><span class=\"c-orange\">自发地调节雇佣工人与资本家之间的利益再分配（错误）<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">比如资本家压榨数学答疑，让答疑干活多但是发工资少，<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">这种现象不会被价值规律所调节<\/span><\/p>",
   "plain": "价值规律在市场配置资源过程中的作用表现在： (1)自发地调节生产资料和劳动力在社会各生产部门之间的分配比例 (2)自发地刺激社会生产力的发展 (3)自发地调节社会收入的分配 自发地调节雇佣工人与资本家之间的利益再分配（错误） 比如资本家压榨数学答疑，让答疑干活多但是发工资少， 这种现象不会被价值规律所调节",

   "no": 29,
   "title": "超额和相对剩余价值",
   "category": "马原",
   "group": "政经",
   "html": "<p class=\"kp-line\"><span class=\"c-gray\">在资本主义商品生产条件下，<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">单个资本家<\/span><span class=\"c-blue\">改进技术、改善管理的<\/span><span class=\"c-blue\">主观动机<\/span><span class=\"c-blue\">是追求<\/span><span class=\"c-blue\">超额<\/span><span class=\"c-blue\">剩<\/span><span class=\"c-blue\">余价值<\/span><span class=\"c-gray\">，<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">但其<\/span><span class=\"c-blue\">客观<\/span><span class=\"c-blue\">后果<\/span><span class=\"c-blue\">则是整个<\/span><span class=\"c-blue\">社会<\/span><span class=\"c-blue\">各个生产部门的劳动生产率普<\/span><span class=\"c-blue\">遍提高<\/span><span class=\"c-gray\">，导致生活资料的价值下降和补偿劳动力价值的必<\/span><span class=\"c-gray\">要劳动时间缩短，而剩余劳动时间相对延长，<\/span><span class=\"c-blue\">整个资本家<\/span><span class=\"c-blue\">阶级普遍获得更多的<\/span><span class=\"c-blue\">相对<\/span><span class=\"c-blue\">剩余价值<\/span><span class=\"c-gray\">。<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">助记：<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">超额<\/span><span class=\"c-gray\">对应<\/span><span class=\"c-blue\">原因，个别<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">相对<\/span><span class=\"c-gray\">对应<\/span><span class=\"c-blue\">结果，社会<\/span><\/p>",
   "plain": "在资本主义商品生产条件下， 单个资本家改进技术、改善管理的主观动机是追求超额剩余价值， 但其客观后果则是整个社会各个生产部门的劳动生产率普遍提高，导致生活资料的价值下降和补偿劳动力价值的必要劳动时间缩短，而剩余劳动时间相对延长，整个资本家阶级普遍获得更多的相对剩余价值。 助记： 超额对应原因，个别 相对对应结果，社会",
   "page": 15

  {
   "no": 30,
   "title": "劳动生产率",
   "category": "马原",
   "group": "政经",
   "html": "<p class=\"kp-line\"><span class=\"c-rose\">劳动生产率<\/span><span class=\"c-gray\">指的是劳动者生产使用价值的效率。<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">它的高低可以用<\/span><span class=\"c-blue\">单位劳动时间内<\/span><span class=\"c-gray\">生产的商品数量来测量，<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">也可以用<\/span><span class=\"c-blue\">单位商品中<\/span><span class=\"c-gray\">所耗费的劳动时间来测量。<\/span><\/p><p class=\"kp-line\">通俗理解方式<\/p><p class=\"kp-line\"><span class=\"c-gray\">第一种：单位时间内，你做得多不多？<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">有人一分钟一个，有人一分钟一亿个。<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">第二种：单位商品，你多久做出来？你做得快不快？<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">有人一秒钟就做一个，有人一小时才做一个。<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">在单位劳动时间内，劳动者耗费的劳动量不变，生产<\/span><span class=\"c-gray\">的价值总量也不变。<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">生产率<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">产出数量<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">生产率<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">做单个商品花费时间<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">单个商品的价值<\/span><\/p>",
   "plain": "劳动生产率指的是劳动者生产使用价值的效率。 它的高低可以用单位劳动时间内生产的商品数量来测量， 也可以用单位商品中所耗费的劳动时间来测量。 通俗理解方式 第一种：单位时间内，你做得多不多？ 有人一分钟一个，有人一分钟一亿个。 第二种：单位商品，你多久做出来？你做得快不快？ 有人一秒钟就做一个，有人一小时才做一个。 在单位劳动时间内，劳动者耗费的劳动量不变，生产的价值总量也不变。 生产率 产出数量 生产率 做单个商品花费时间 单个商品的价值",
   "page": 15

  {
   "no": 31,
   "title": "不变资本和可变资本",
   "category": "马原",
   "group": "政经",
   "html": "<p class=\"kp-line\"><span class=\"c-blue\">根据资本在<\/span><span class=\"c-rose\">剩余价值生产中<\/span><span class=\"c-blue\">所起的不同作用<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">可以将资本划分为<\/span><span class=\"c-rose\">不变资本与可变资本<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">不变资本 (c):<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">以<\/span><span class=\"c-rose\">生产资料<\/span><span class=\"c-gray\">形态存在的资本<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">这部分资本在生产过程中，<\/span><span class=\"c-rose\">不改变自己的价值量，不发生<\/span><span class=\"c-rose\">增殖<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">不变资本的价值是具体劳动转移到新产品中<\/span><span class=\"c-orange\">（可一次转移<\/span><span class=\"c-orange\">，也可多次转移）<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">可变资本 (v)：<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">用来<\/span><span class=\"c-rose\">购买劳动力<\/span><span class=\"c-gray\">的那部分资本<\/span><\/p><p class=\"kp-line\"><span class=\"c-rose\">剩余价值<\/span><span class=\"c-gray\">是由可变资本雇佣的劳动者创造的<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">可变资本的价值是工人的劳动再生产出来的<\/span><span class=\"c-gray\">（可变资本是<\/span><span class=\"c-gray\">工人干活干出来的）<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">【剩余价值】是雇佣工人所创造并被资本家无偿占有的超<\/span><span class=\"c-gray\">过劳动力价值的那部分价值，是雇佣工人剩余劳动的凝结<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">资本的<\/span><span class=\"c-gray\">技术<\/span><span class=\"c-blue\">构成<\/span><span class=\"c-gray\">：<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">由生产的技术水平所决定的<\/span><span class=\"c-rose\">生产资料<\/span><span class=\"c-gray\">和<\/span>劳动力<span class=\"c-gray\">之间的比例<\/span><span class=\"c-gray\">。<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">（<\/span><span class=\"c-rose\">几台烤箱 + 多少面粉<\/span>VS几个面包师傅<span class=\"c-gray\">）<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">资本的<\/span><span class=\"c-gray\">价值<\/span><span class=\"c-blue\">构成<\/span><span class=\"c-gray\">：<\/span><\/p><p class=\"kp-line\"><span class=\"c-rose\">不变资本<\/span><span class=\"c-gray\">（c）和<\/span>可变资本<span class=\"c-gray\">（v）之间的比例。<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">（<\/span><span class=\"c-rose\">买烤箱和面粉花了多少钱<\/span>VS给师傅发了多少工资<span class=\"c-gray\">）<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">资本的<\/span><span class=\"c-gray\">有机<\/span><span class=\"c-blue\">构成<\/span><span class=\"c-gray\">：<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">由资本的技术构成决定并反映技术构成变化的资本价值构<\/span><span class=\"c-gray\">成，即<\/span><span class=\"c-rose\">c<\/span><span class=\"c-gray\">：<\/span>v<span class=\"c-gray\">。<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">（花钱的比例(c:v)，是由烤箱和师傅的搭配方式决定的<\/span><span class=\"c-gray\">）<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">在资本主义生产过程中<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">资本<\/span><span class=\"c-blue\">有机<\/span><span class=\"c-gray\">构成的<\/span><span class=\"c-blue\">提高是一般趋势，这是由资本的本性决定<\/span><span class=\"c-blue\">的<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">展开理解，当面包老板升级设备时：<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">他的技术构成提高了（<\/span><span class=\"c-rose\">机器<\/span><span class=\"c-gray\">多了先进了，需要的<\/span>师傅<span class=\"c-gray\">少了）。<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">这个变化必然导致他的价值构成也提高了<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">（买<\/span><span class=\"c-rose\">机器的钱<\/span><span class=\"c-gray\">的比例，相对于<\/span>工资<span class=\"c-gray\">的比例，大大增加了）<\/span><span class=\"c-gray\">。<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">我们就说，他的面包店的资本有有机成提高了。<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">（拓展：整个社会资本有机构成普遍提高会形成相对过剩<\/span><span class=\"c-gray\">人口）<\/span><\/p><p class=\"kp-line\"><span class=\"c-orange\">技术变<\/span><span class=\"c-rose\">，价值变，<\/span><span class=\"c-orange\">有机也就变<\/span><\/p><p class=\"kp-line\"><span class=\"c-rose\">技术不变，价值变，有机就不变<\/span><\/p>",
   "plain": "根据资本在剩余价值生产中所起的不同作用 可以将资本划分为不变资本与可变资本 不变资本 (c): 以生产资料形态存在的资本 这部分资本在生产过程中，不改变自己的价值量，不发生增殖 不变资本的价值是具体劳动转移到新产品中（可一次转移，也可多次转移） 可变资本 (v)： 用来购买劳动力的那部分资本 剩余价值是由可变资本雇佣的劳动者创造的 可变资本的价值是工人的劳动再生产出来的（可变资本是工人干活干出来的） 【剩余价值】是雇佣工人所创造并被资本家无偿占有的超过劳动力价值的那部分价值，是雇佣工人剩余劳动的凝结 资本的技术构成： 由生产的技术水平所决定的生产资料和劳动力之间的比例。 （几台烤箱 + 多少面粉 VS 几个面包师傅） 资本的价值构成： 不变资本（c）和可变资本（v）之间的比例。 （买烤箱和面粉花了多少钱 VS 给师傅发了多少工资） 资本的有机构成： 由资本的技术构成决定并反映技术构成变化的资本价值构成，即c：v。 （花钱的比例(c:v)，是由烤箱和师傅的搭配方式决定的） 在资本主义生产过程中 资本有机构成的提高是一般趋势，这是由资本的本性决定的 展开理解，当面包老板升级设备时： 他的技术构成提高了（机器多了先进了，需要的师傅少了）。 这个变化必然导致他的价值构成也提高了 （买机器的钱的比例，相对于工资的比例，大大增加了）。 我们就说，他的面包店的资本有有机成提高了。 （拓展：整个社会资本有机构成普遍提高会形成相对过剩人口） 技术变，价值变，有机也就变 技术不变，价值变，有机就不变",
   "page": 15
  },

   "no": 32,
   "title": "平均利润",
   "category": "马原",
   "group": "政经",
   "html": "<p class=\"kp-line\"><span class=\"c-blue\">平均利润的形成原因：<\/span><\/p><p class=\"kp-line\"><span class=\"c-rose\">不同<\/span><span class=\"c-gray\">生产<\/span><span class=\"c-rose\">部门<\/span><span class=\"c-gray\">资本家之间的竞争<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">扩展：<\/span><span class=\"c-blue\">超额利润的形成原因<\/span><\/p><p class=\"kp-line\"><span class=\"c-rose\">同一部门<\/span><span class=\"c-gray\">内不同企业之间的竞争<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">理解：<\/span><span class=\"c-gray\">为了得到尽可能高的利润率和尽可能多的利润，<\/span><\/p><p class=\"kp-line\"><span class=\"c-rose\">不同生产部门<\/span><span class=\"c-gray\">（通俗理解：不同“赛道”）的资本家之间<\/span><span class=\"c-gray\">必然展开激烈的竞争，<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">大量资本必然从利润率<\/span><span class=\"c-rose\">低<\/span><span class=\"c-gray\">的部门<\/span><span class=\"c-rose\">转<\/span><span class=\"c-gray\">投到利润率<\/span><span class=\"c-rose\">高<\/span><span class=\"c-gray\">的部门，<\/span><span class=\"c-gray\">从而导致利润率平均化。<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">注意：不同“赛道”、同一“赛道”是网络用语，非专业术语，只<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">是帮助大家理解这个<\/span><span class=\"c-gray\">概<\/span><span class=\"c-gray\">念。<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">平均利润形成后：<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">商品价值就转化为生产价格<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">价值规律的实现形式发生了变化<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">每个资本家所得利润的多少不仅取决于他对本企业工<\/span><span class=\"c-gray\">人的剥削程度，而且取决于整个资产阶级对整个工人阶级<\/span><span class=\"c-gray\">的剥削程度<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">生产价格不再随着商品价值的变化而变动<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">每一个部门获得的利润都等于该部门生产的剩余价值<\/span><\/p>",
   "plain": "平均利润的形成原因： 不同生产部门资本家之间的竞争 扩展：超额利润的形成原因 同一部门内不同企业之间的竞争 理解：为了得到尽可能高的利润率和尽可能多的利润， 不同生产部门（通俗理解：不同“赛道”）的资本家之间必然展开激烈的竞争， 大量资本必然从利润率低的部门转投到利润率高的部门，从而导致利润率平均化。 注意：不同“赛道”、同一“赛道”是网络用语，非专业术语，只 是帮助大家理解这个概念。 平均利润形成后： 商品价值就转化为生产价格 价值规律的实现形式发生了变化 每个资本家所得利润的多少不仅取决于他对本企业工人的剥削程度，而且取决于整个资产阶级对整个工人阶级的剥削程度 生产价格不再随着商品价值的变化而变动 每一个部门获得的利润都等于该部门生产的剩余价值",
   "page": 16
  },
  {
   "no": 33,
   "title": "政经计算",
   "category": "马原",
   "group": "计算",
   "html": "<p class=\"kp-line\"><span class=\"c-blue\">不变资本C 可变资本V 剩余价值M<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">投资=成本=C+V<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">有机构成C比V<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">剩余价值率M比V<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">利润=M<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">蓝色是已知条件<\/span><span class=\"c-gray\">，<\/span><span class=\"c-red\">红色为所求<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">某资本家投资100万元<\/span><span class=\"c-gray\">，<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">其中既包括不变资本(c)也包括可变资本(v),即c+v=100<\/span><span class=\"c-gray\">万元。<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">其预付资本的有机构成是3:1<\/span><span class=\"c-gray\">,资本有机构成公式是c:v,即<\/span><span class=\"c-gray\">c:v=3:1,<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">结合前文已知c+v=100万元，则不变资本c为75万元，可<\/span><span class=\"c-gray\">变资本v为25万元。<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">该资本家每次投资的剩余价值率为200%<\/span><span class=\"c-gray\">,即m/v=200%,<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">则每次投资的剩余价值m为50万元。<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">利润与剩余价值在量上是一样的，故该<\/span><span class=\"c-red\">资本家每次投资的<\/span><span class=\"c-red\">利润<\/span><span class=\"c-gray\">为50万元。<\/span><\/p>",
   "plain": "不变资本C 可变资本V 剩余价值M 投资=成本=C+V 有机构成C比V 剩余价值率M比V 利润=M 蓝色是已知条件，红色为所求 某资本家投资100万元， 其中既包括不变资本(c)也包括可变资本(v),即c+v=100万元。 其预付资本的有机构成是3:1,资本有机构成公式是c:v,即c:v=3:1, 结合前文已知c+v=100万元，则不变资本c为75万元，可变资本v为25万元。 该资本家每次投资的剩余价值率为200%,即m/v=200%, 则每次投资的剩余价值m为50万元。 利润与剩余价值在量上是一样的，故该资本家每次投资的利润为50万元。",
   "page": 16
  },
  {
   "no": 34,
   "title": "绝对和相对剩余价值计算",
   "category": "马原",
   "group": "计算",
   "html": "<p class=\"kp-line\"><span class=\"c-blue\">绝对剩余价值生产方法，比较大胆，总的工作时间延长。<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">相对剩余价值生产方法，比较隐蔽，工作日时间不变。<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">绝对剩余价值的生产和相对剩余价值的生产都是依靠<\/span><span class=\"c-orange\">延长工人的剩余劳动时间<\/span><span class=\"c-blue\">获得的。<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">剩余价值率=剩余劳动时间÷必要劳动时间<\/span><\/p><p class=\"kp-line\">若原工作时间8小时，必要劳动时间4小时，剩余劳动时间4小时<\/p><p class=\"kp-line\">采用【绝对剩余价值】生产方法，使剩余劳动时间延长2小时<\/p><p class=\"kp-line\">延长劳动时间:8+2<\/p><p class=\"kp-line\">剩余价值率=6(总时长为10剪掉必要的4)÷4×100%=150%<\/p><p class=\"kp-line\">采用【相对剩余价值】生产方法，使剩余劳动时间延长2小时<\/p><p class=\"kp-line\">(通过技术在总时长不变的情况下缩短必要劳动时间)<\/p><p class=\"kp-line\">必要劳动时间=4-2<\/p><p class=\"kp-line\">剩余价值率=6(8-2)÷2×100%=300%<\/p>",
   "plain": "绝对剩余价值生产方法，比较大胆，总的工作时间延长。 相对剩余价值生产方法，比较隐蔽，工作日时间不变。 绝对剩余价值的生产和相对剩余价值的生产都是依靠延长工人的剩余劳动时间获得的。 剩余价值率=剩余劳动时间÷必要劳动时间 若原工作时间8小时，必要劳动时间4小时，剩余劳动时间4小时 采用【绝对剩余价值】生产方法，使剩余劳动时间延长2小时 延长劳动时间:8+2 剩余价值率=6(总时长为10剪掉必要的4)÷4×100%=150% 采用【相对剩余价值】生产方法，使剩余劳动时间延长2小时 (通过技术在总时长不变的情况下缩短必要劳动时间) 必要劳动时间=4-2 剩余价值率=6(8-2)÷2×100%=300%",
   "page": 16
  },
  {
   "no": 35,
   "title": "战时共产主义与新经济政策",
   "category": "马原",
   "group": "国际",
   "html": "<p class=\"kp-line\"><span class=\"c-red\">战时共产主义<\/span>：<span class=\"c-blue\">余粮收集制、取消商品货币关系<\/span><\/p><p class=\"kp-line\">——<span class=\"c-blue\">更好的供给军队作战<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">新经济政策<\/span><span class=\"c-orange\">（列宁）<\/span>：<span class=\"c-blue\">恢复商品货币关系，发展资本主义<\/span><\/p><p class=\"kp-line\">——<span class=\"c-blue\">战后迅速活跃经济<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">新经济政策的主要特征是发展商品经济<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">苏联模式<\/span><span class=\"c-orange\">（斯大林）<\/span>：<span class=\"c-blue\">农业合作化<\/span><\/p><p class=\"kp-line\">——<span class=\"c-blue\">进一步发展社会主义<\/span><\/p><p class=\"kp-line\"><span class=\"c-orange\">列宁为社会主义奠定了基础，但列宁并未发展社会主义<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">新经济政策（和战时作比较）<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">农业<\/span><span class=\"c-gray\">：<\/span><span class=\"c-blue\">粮食税制取代余粮收集制<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">不再全部收走，交完税了多的归你，允许农民自由出卖余<\/span><span class=\"c-gray\">粮<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">工业<\/span><span class=\"c-gray\">：<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">1.<\/span><span class=\"c-blue\">部分恢复私营经济<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">允许私人经营中小企业，但关系国家命脉的企业仍归国家<\/span><span class=\"c-gray\">所有<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">2.<\/span><span class=\"c-blue\">实行国家资本主义<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">采取租让制和租借制，允许外资企业管理国家暂时无力经<\/span><span class=\"c-gray\">营的企业<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">贸易<\/span><span class=\"c-gray\">：<\/span><span class=\"c-blue\">允许自由贸易<\/span><span class=\"c-gray\">（废除了国家配给和国家贸易垄<\/span><span class=\"c-gray\">断制）<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">分配<\/span><span class=\"c-gray\">：<\/span><span class=\"c-blue\">实行按劳分配<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">流通<\/span><span class=\"c-gray\">：<\/span><span class=\"c-blue\">恢复商品货币关系<\/span><\/p>",
   "plain": "战时共产主义：余粮收集制、取消商品货币关系 ——更好的供给军队作战 新经济政策（列宁）：恢复商品货币关系，发展资本主义 ——战后迅速活跃经济 新经济政策的主要特征是发展商品经济 苏联模式（斯大林）：农业合作化 ——进一步发展社会主义 列宁为社会主义奠定了基础，但列宁并未发展社会主义 新经济政策（和战时作比较） 农业：粮食税制取代余粮收集制 不再全部收走，交完税了多的归你，允许农民自由出卖余粮 工业： 1.部分恢复私营经济 允许私人经营中小企业，但关系国家命脉的企业仍归国家所有 2.实行国家资本主义 采取租让制和租借制，允许外资企业管理国家暂时无力经营的企业 贸易：允许自由贸易（废除了国家配给和国家贸易垄断制） 分配：实行按劳分配 流通：恢复商品货币关系",
   "page": 17
  },

   "no": 36,
   "title": "巴黎公社",
   "category": "马原",
   "group": "国际",
   "html": "<p class=\"kp-line\"><span class=\"c-gray\">1871年爆发的巴黎公社革命，<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">是第一国际精神的产儿，<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">是无产阶级<\/span><span class=\"c-orange\">夺取政权<\/span><span class=\"c-gray\">的第一次伟大尝试。<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">特别是<\/span><span class=\"c-gray\">采取了两项重要措施，用以防止国家机关工作人员<\/span><span class=\"c-gray\">由社会公仆变为社会主人：<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">一是<\/span><span class=\"c-blue\">规定所有公职人员无论职位高低，实行全面的选举制<\/span><span class=\"c-blue\">和撤换制<\/span><span class=\"c-gray\">；<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">二是<\/span><span class=\"c-blue\">取消高薪制，规定任何工作人员年薪不得超过熟练工<\/span><span class=\"c-blue\">人的工薪水平<\/span><span class=\"c-gray\">。<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">要点：<\/span><\/p><p class=\"kp-line\"><span class=\"c-orange\">巴黎公社建立的是政权，不是政党<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">防止公仆变主人的<\/span><span class=\"c-orange\">两项措施与人相关<\/span><span class=\"c-gray\">，即<\/span><span class=\"c-orange\">人的工资和<\/span><span class=\"c-orange\">职位<\/span><span class=\"c-gray\">，<\/span><span class=\"c-blue\">取消高薪，选举撤换<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">辨析：<\/span><span class=\"c-blue\">俄国十月革命<\/span><span class=\"c-gray\">才<\/span><span class=\"c-blue\">建立苏维埃大会制度<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">巴黎公社革命源于民族矛盾和阶级斗争激化，<\/span><\/p><p class=\"kp-line\"><span class=\"c-orange\">不是第一国际发动和领导<\/span><span class=\"c-gray\">，只是受第一国际精神影响。<\/span><\/p>",
   "plain": "1871年爆发的巴黎公社革命， 是第一国际精神的产儿， 是无产阶级夺取政权的第一次伟大尝试。 特别是采取了两项重要措施，用以防止国家机关工作人员由社会公仆变为社会主人： 一是规定所有公职人员无论职位高低，实行全面的选举制和撤换制； 二是取消高薪制，规定任何工作人员年薪不得超过熟练工人的工薪水平。 要点： 巴黎公社建立的是政权，不是政党 防止公仆变主人的两项措施与人相关，即人的工资和职位，取消高薪，选举撤换 辨析：俄国十月革命才建立苏维埃大会制度 巴黎公社革命源于民族矛盾和阶级斗争激化， 不是第一国际发动和领导，只是受第一国际精神影响。",
   "page": 17
  },

   "category": "史纲",
   "group": "早期",
   "html": "<p class=\"kp-line\"><span class=\"c-red\">三元里人民的抗英斗争<\/span><span class=\"c-gray\">是中国近代史上中国人民<\/span><span class=\"c-blue\">第一次大<\/span><span class=\"c-blue\">规模的反侵略武装斗争<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">太平天国农民运动<\/span><span class=\"c-gray\">是中国近代历史上<\/span><span class=\"c-blue\">第一次反对国内封建<\/span><span class=\"c-blue\">势力和外国侵略势力的斗争<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">失败的根本原因<\/span><span class=\"c-gray\">：<\/span><span class=\"c-orange\">农民阶级自身的阶级局限性<\/span><\/p>",

   "no": 40,
   "title": "洋务运动",
   "category": "史纲",
   "group": "早期",
   "html": "<p class=\"kp-line\"><span class=\"c-gray\">洋务派提出<\/span><span class=\"c-blue\">“自强”“求富”<\/span><span class=\"c-gray\">的主张（也是目标）<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">洋务运动的指导思想（冯桂芬提出）<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">“中学为体，西学为用”<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">通过所掌握的国家权力集中力量<\/span><span class=\"c-rose\">优先发展军事工业<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">洋务派兴办洋务事业首先是为了购买和制造洋枪洋炮以镇<\/span><span class=\"c-gray\">压农民起义，<\/span><span class=\"c-red\">主要目的<\/span><span class=\"c-gray\">是<\/span><span class=\"c-blue\">维护封建统治<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">洋务运动失败的主要原因：<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">洋务运动具有<\/span><span class=\"c-rose\">封<\/span><span class=\"c-gray\">建性<\/span><span class=\"c-rose\">（决定）<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">洋务运动对列强具有<\/span><span class=\"c-rose\">依<\/span><span class=\"c-gray\">赖性<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">洋务企业的管理具有<\/span><span class=\"c-rose\">腐<\/span><span class=\"c-gray\">朽性<\/span><\/p><p class=\"kp-line\"><span class=\"c-rose\">缝衣服<\/span><\/p>",
   "plain": "洋务派提出“自强”“求富”的主张（也是目标） 洋务运动的指导思想（冯桂芬提出） “中学为体，西学为用” 通过所掌握的国家权力集中力量优先发展军事工业 洋务派兴办洋务事业首先是为了购买和制造洋枪洋炮以镇压农民起义，主要目的是维护封建统治 洋务运动失败的主要原因： 洋务运动具有封建性（决定） 洋务运动对列强具有依赖性 洋务企业的管理具有腐朽性 缝衣服",

   "title": "林则徐 严复 魏源 郑观应",
   "category": "史纲",
   "group": "早期",
   "html": "<p class=\"kp-line\"><span class=\"c-red\">徐四睁<\/span><span class=\"c-blue\">眼见<\/span><span class=\"c-red\">阎王喂海狮 郑观应是公主<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">威海技师<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">林则<\/span><span class=\"c-red\">徐：<\/span><span class=\"c-blue\">《<\/span><span class=\"c-red\">四<\/span><span class=\"c-blue\">洲志》<\/span><span class=\"c-red\">睁<\/span><span class=\"c-blue\">眼看世界第一人<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">严<\/span><span class=\"c-blue\">复：救<\/span><span class=\"c-red\">亡<\/span><span class=\"c-blue\">图存<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">魏<\/span><span class=\"c-blue\">源：《<\/span><span class=\"c-red\">海<\/span><span class=\"c-blue\">国图志》“<\/span><span class=\"c-red\">师<\/span><span class=\"c-blue\">夷长<\/span><span class=\"c-red\">技<\/span><span class=\"c-blue\">以制夷”<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">开创了中国近代向西方学习的新风<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">郑观应<\/span><span class=\"c-blue\">：《盛<\/span><span class=\"c-red\">世<\/span><span class=\"c-blue\">危言》“君民<\/span><span class=\"c-red\">共主<\/span><span class=\"c-blue\">”<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">追求实行民主共和制度的思想<\/span><\/p>",
   "plain": "徐四睁眼见阎王喂海狮 郑观应是公主 威海技师 林则徐：《四洲志》睁眼看世界第一人 严复：救亡图存 魏源：《海国图志》“师夷长技以制夷” 开创了中国近代向西方学习的新风 郑观应：《盛世危言》“君民共主” 追求实行民主共和制度的思想",

  {
   "no": 42,
   "title": "论战",
   "category": "史纲",
   "group": "早期",
   "html": "<p class=\"kp-line\"><span class=\"c-red\">维新派与守旧派的论战<\/span><\/p><p class=\"kp-line\"><span class=\"c-rose\">是近代中国资产阶级思想与封建主义思想的第一次正面交<\/span><span class=\"c-rose\">锋<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">维新派与守旧派论战<\/span><span class=\"c-gray\">内容：<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">要不要变法<\/span><span class=\"c-gray\">（<\/span><span class=\"c-orange\">中心<\/span><span class=\"c-gray\">）；<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">要不要兴民权、设议院、实行君主立宪（后来变法中没有<\/span><span class=\"c-gray\">采纳）；<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">要不要废八股、改科举和兴西学。（注意不是废科举，清<\/span><span class=\"c-gray\">末“新政”才废除科举）<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">维新派与洋务派分歧的实质<\/span><span class=\"c-gray\">是<\/span><span class=\"c-blue\">要不要学习西方的政治制度<\/span><span class=\"c-blue\">与思想文化<\/span><\/p><p class=\"kp-line\">维新派技术思想都学，洋务派只学技术不学思想<\/p><p class=\"kp-line\"><span class=\"c-red\">维新派与革命派的论战<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">这次论战划清了<\/span><span class=\"c-gray\">革命与改良的界限，<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">传播了民主革命思想，促进了革命形<\/span><span class=\"c-gray\">势的发展<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">但同时也暴露了革命派在思想理论方面的弱点，即不敢反<\/span><span class=\"c-gray\">帝反封建。<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">内容：<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">要不要以革命手段推翻清王朝<\/span><span class=\"c-gray\">（这是双方论战的<\/span><span class=\"c-orange\">焦点<\/span><span class=\"c-gray\">）<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">要不要推翻帝制，实行共和<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">要不要社会革命<\/span><\/p>",
   "plain": "维新派与守旧派的论战 是近代中国资产阶级思想与封建主义思想的第一次正面交锋 维新派与守旧派论战内容： 要不要变法（中心）； 要不要兴民权、设议院、实行君主立宪（后来变法中没有采纳）； 要不要废八股、改科举和兴西学。（注意不是废科举，清末“新政”才废除科举） 维新派与洋务派分歧的实质是要不要学习西方的政治制度与思想文化 维新派技术思想都学，洋务派只学技术不学思想 维新派与革命派的论战 这次论战划清了革命与改良的界限， 传播了民主革命思想，促进了革命形势的发展 但同时也暴露了革命派在思想理论方面的弱点，即不敢反帝反封建。 内容： 要不要以革命手段推翻清王朝（这是双方论战的焦点） 要不要推翻帝制，实行共和 要不要社会革命",
   "page": 19
  },

   "no": 43,
   "title": "早期信仰马克思主义的人物",
   "category": "史纲",
   "group": "早期",
   "html": "<p class=\"kp-line\"><span class=\"c-gray\">中国早期信仰马克思主义的人物，主要有三种类型:<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">新文化运动的精神领袖<\/span><span class=\"c-gray\">，主要代表人物是李大钊、陈独秀<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">五四爱国运动的左翼骨干<\/span><span class=\"c-gray\">，主要代表为毛泽东等<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">原中国同盟会会员、辛亥革命时期的活动家<\/span><span class=\"c-gray\">，其代表<\/span><span class=\"c-gray\">为董必武等<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">其<\/span><span class=\"c-red\">主体<\/span><span class=\"c-gray\">部分是:<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">五四爱国运动的左翼<\/span><span class=\"c-red\">骨干<\/span><\/p>",
   "plain": "中国早期信仰马克思主义的人物，主要有三种类型: 新文化运动的精神领袖，主要代表人物是李大钊、陈独秀 五四爱国运动的左翼骨干，主要代表为毛泽东等 原中国同盟会会员、辛亥革命时期的活动家，其代表为董必武等 其主体部分是: 五四爱国运动的左翼骨干",

   "category": "史纲",
   "group": "早期",
   "html": "<p class=\"kp-line\"><span class=\"c-gray\">新文化运动的倡导者<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">(1)以进化论观点和个性解放思想为主要武器<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">(2)<\/span><span class=\"c-red\">批<\/span><span class=\"c-gray\">判<\/span><span class=\"c-red\">孔<\/span><span class=\"c-gray\">学，是为了给中国<\/span><span class=\"c-red\">发<\/span><span class=\"c-gray\">展<\/span><span class=\"c-red\">资<\/span><span class=\"c-gray\">本主义扫清障碍，<\/span><span class=\"c-orange\">但<\/span><span class=\"c-orange\">没彻底否定孔学的历史作用<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">屁孔发紫<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">(3)大力提倡新道德、反对旧道德，提倡新文学、反对旧<\/span><span class=\"c-gray\">文学，包括提倡白话文、反对文言文。提倡民主、反对专<\/span><span class=\"c-gray\">制，提倡科学、反对迷信盲从<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-blue\">(4)五四以前的新文化运动局限性<\/span><span class=\"c-gray\">：<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">①提倡资产阶级民主主义<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">②把<\/span><span class=\"c-red\">改造国民性<\/span><span class=\"c-gray\">置于优先地位<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">③还没有马克思主义<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">后来十月革命给中国送来了马克思主义<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">五四以后的新文化运动<\/span><span class=\"c-gray\">则发展到了一个新阶段<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">马克思主义开始逐步地在思想文化领域中发挥指导作用<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">五四运动的直接导火线<\/span><span class=\"c-gray\">：<\/span><span class=\"c-red\">巴黎和会上中国外交的失败<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">李大钊<\/span><span class=\"c-red\">率先<\/span><span class=\"c-gray\">在中国大地上举起<\/span><span class=\"c-red\">马克思主义<\/span><span class=\"c-gray\">旗帜<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">其发表的《我的马克思主义观》标志着<\/span><span class=\"c-red\">马克思主义<\/span><span class=\"c-gray\">在中国<\/span><span class=\"c-gray\">进入一个比较<\/span><span class=\"c-red\">系统<\/span><span class=\"c-gray\">的传播阶段<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">十月革命<\/span><span class=\"c-gray\">使中国先进分子从<\/span><span class=\"c-blue\">资产阶级民主主义<\/span><span class=\"c-gray\">转向<\/span><span class=\"c-red\">社<\/span><span class=\"c-red\">会主义<\/span><\/p>",
   "plain": "新文化运动的倡导者 (1)以进化论观点和个性解放思想为主要武器 (2)批判孔学，是为了给中国发展资本主义扫清障碍，但没彻底否定孔学的历史作用 屁孔发紫 (3)大力提倡新道德、反对旧道德，提倡新文学、反对旧文学，包括提倡白话文、反对文言文。提倡民主、反对专制，提倡科学、反对迷信盲从 (4)五四以前的新文化运动局限性： ①提倡资产阶级民主主义 ②把改造国民性置于优先地位 ③还没有马克思主义 后来十月革命给中国送来了马克思主义 五四以后的新文化运动则发展到了一个新阶段 马克思主义开始逐步地在思想文化领域中发挥指导作用 五四运动的直接导火线：巴黎和会上中国外交的失败 李大钊率先在中国大地上举起马克思主义旗帜 其发表的《我的马克思主义观》标志着马克思主义在中国进入一个比较系统的传播阶段 十月革命使中国先进分子从资产阶级民主主义转向社会主义",
   "page": 19

   "no": 46,
   "title": "工人罢工运动",
   "category": "史纲",
   "group": "大革命",
   "html": "<p class=\"kp-line\"><span class=\"c-blue\">中国工人运动的第一个高潮（海员到京汉）<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">1922.1<\/span><span class=\"c-blue\">香港<\/span><span class=\"c-rose\">海<\/span><span class=\"c-blue\">员—<\/span><span class=\"c-rose\">起点<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">1922.9<\/span><span class=\"c-blue\">安源<\/span><span class=\"c-rose\">路<\/span><span class=\"c-blue\">矿—完全<\/span><span class=\"c-rose\">胜<\/span><span class=\"c-blue\">利<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">1922.10<\/span><span class=\"c-blue\">开滦<\/span><span class=\"c-rose\">五<\/span><span class=\"c-blue\">矿—<\/span><span class=\"c-rose\">非<\/span><span class=\"c-blue\">完全<\/span><span class=\"c-rose\">胜<\/span><span class=\"c-blue\">利<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-gray\">1923.2<\/span><span class=\"c-blue\">京<\/span><span class=\"c-rose\">汉<\/span><span class=\"c-blue\">铁路—<\/span><span class=\"c-rose\">终点（高潮）<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">持续时间<\/span><span class=\"c-rose\">最长<\/span><span class=\"c-blue\">的罢工：<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">1925-1926<\/span><span class=\"c-rose\">省港<\/span><span class=\"c-blue\">大罢工<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">慕容云<\/span><span class=\"c-rose\">海<\/span><span class=\"c-gray\">是<\/span><span class=\"c-rose\">起点<\/span><span class=\"c-gray\">张<\/span><span class=\"c-rose\">翰<\/span><span class=\"c-gray\">是<\/span><span class=\"c-rose\">终点<\/span><span class=\"c-rose\">六胜五不胜 省港最长<\/span><\/p>",
   "plain": "中国工人运动的第一个高潮（海员到京汉） 1922.1香港海员—起点 1922.9安源路矿—完全胜利 1922.10开滦五矿—非完全胜利 1923.2京汉铁路—终点（高潮） 持续时间最长的罢工： 1925-1926省港大罢工 慕容云海是起点 张翰是终点 六胜五不胜 省港最长",

   "no": 47,
   "title": "孙中山",
   "category": "史纲",
   "group": "大革命",
   "html": "<p class=\"kp-line\"><span class=\"c-gray\">第一个响亮喊出<\/span><span class=\"c-rose\">“振兴中华”<\/span><span class=\"c-gray\">的口号<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">创立<\/span><span class=\"c-rose\">兴中会（第一个）、同盟会<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">提出<\/span><span class=\"c-rose\">民族、民权、民生<\/span><span class=\"c-gray\">的三民主义<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">领导了辛亥革命<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">1911年，在他领导和影响下，震惊世界的辛亥革命取得<\/span><span class=\"c-gray\">成功，<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">推翻了清王朝统治，结束了统治中国几千年的君主专制制<\/span><span class=\"c-gray\">度<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">中国共产党成立后，孙中山先生同中国共产党人真诚合作<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">在中国共产党帮助下，把旧三民主义发展为<\/span><span class=\"c-rose\">新三民主义<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">实行<\/span><span class=\"c-rose\">联俄、联共、扶助农工<\/span><span class=\"c-gray\">三大政策<\/span><\/p><p class=\"kp-line\"><span class=\"c-rose\">孙中山改组国民党，促成第一次国共合作，为后来北<\/span><span class=\"c-rose\">伐创造条件，推动反帝反封建革命前进<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">（<\/span><span class=\"c-blue\">北伐战争是在孙中山逝世之后发生的，不由孙中山发动<\/span><span class=\"c-gray\">）<\/span><\/p>",
   "plain": "第一个响亮喊出“振兴中华”的口号 创立兴中会（第一个）、同盟会 提出民族、民权、民生的三民主义 领导了辛亥革命 1911年，在他领导和影响下，震惊世界的辛亥革命取得成功， 推翻了清王朝统治，结束了统治中国几千年的君主专制制度 中国共产党成立后，孙中山先生同中国共产党人真诚合作 在中国共产党帮助下，把旧三民主义发展为新三民主义 实行联俄、联共、扶助农工三大政策 孙中山改组国民党，促成第一次国共合作，为后来北伐创造条件，推动反帝反封建革命前进 （北伐战争是在孙中山逝世之后发生的，不由孙中山发动）",
   "page": 20

  {
   "no": 48,
   "title": "新旧三民主义",
   "category": "史纲",
   "group": "大革命",
   "html": "<p class=\"kp-line\"><span class=\"c-rose\">旧三民主义：<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">驱除鞑虏，恢复中华<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">创立民国<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">平均地权<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">旧三民主义的局限：<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">民族主义的局限性<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">没有从正面鲜明地提出反对帝国主义的主张<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">没有保证广大劳动群众在国家中的地位<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">民生主义指的是“平均地权”，其局限性表现在<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">没有正面触及封建土地所有制，不能满足广大农民的土地<\/span><span class=\"c-gray\">要求<\/span><\/p><p class=\"kp-line\"><span class=\"c-rose\">新三民主义：<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">民族：突出反帝内容，对外实行民族独立，对内主张<\/span><span class=\"c-gray\">民族平等<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">民权：民主权利“为一般平民所共有”，不应为“少<\/span><span class=\"c-gray\">数人所得私”<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">民生：平均地权和节制资本（后又提出耕者有其田）<\/span><span class=\"c-gray\">并提出改善工农生活状况<\/span><\/p><p class=\"kp-line\">三民无主<\/p><p class=\"kp-line\"><span class=\"c-blue\">新旧三民主义，都是民族，民生，民权。从来没有民主，<\/span><span class=\"c-blue\">有民主就错<\/span><\/p><p class=\"kp-line\">新三民主义的政纲同中国共产党在民主革命阶段的纲领基本一致，<\/p><p class=\"kp-line\">因而有了国共合作的政治基础<\/p>",
   "plain": "旧三民主义： 驱除鞑虏，恢复中华 创立民国 平均地权 旧三民主义的局限： 民族主义的局限性 没有从正面鲜明地提出反对帝国主义的主张 没有保证广大劳动群众在国家中的地位 民生主义指的是“平均地权”，其局限性表现在 没有正面触及封建土地所有制，不能满足广大农民的土地要求 新三民主义： 民族：突出反帝内容，对外实行民族独立，对内主张民族平等 民权：民主权利“为一般平民所共有”，不应为“少数人所得私” 民生：平均地权和节制资本（后又提出耕者有其田）并提出改善工农生活状况 三民无主 新旧三民主义，都是民族，民生，民权。从来没有民主，有民主就错 新三民主义的政纲同中国共产党在民主革命阶段的纲领基本一致， 因而有了国共合作的政治基础",
   "page": 20

   "no": 49,
   "title": "旧民主主义革命的终结和新民主主义革命的开端",
   "category": "史纲",
   "group": "大革命",
   "html": "<p class=\"kp-line\"><span class=\"c-red\">护法运动的失败<\/span><span class=\"c-gray\">不仅是孙中山个人的失败<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">也标志着整个中国民族资产阶级领导的<\/span><span class=\"c-blue\">旧民主主义革命的<\/span><span class=\"c-blue\">终结<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">使孙中山认识到“南与北如一丘之貉”，想依靠南方<\/span><span class=\"c-blue\">军阀来反对北洋军阀行不通的事件是<\/span><span class=\"c-orange\">护法运动<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">五四运动<\/span><span class=\"c-gray\">成为中国革命的新阶段即<\/span><span class=\"c-blue\">新民主主义革命<\/span><span class=\"c-gray\">阶<\/span><span class=\"c-gray\">段<\/span><span class=\"c-blue\">的开端<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">无产阶级的领导权是中国革命的中心问题，也是新民主主<\/span><span class=\"c-gray\">义革命理论的核心问题。<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">区别新、旧两种不同范畴的民主主义革命的根本标志<\/span><span class=\"c-gray\">是，<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">革命的领导权是掌握在无产阶级手中还是掌握在资产阶级<\/span><span class=\"c-blue\">手中<\/span><span class=\"c-gray\">。<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">一定要注意，虽然“新民主主义革命”有个“新”字，<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">但其性质依然是资产阶级民主主义革命<\/span><span class=\"c-gray\">(由社会性质、革<\/span><span class=\"c-gray\">命对象、革命任务等决定)。<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">但是，中国革命已不是旧式的、一般的资产阶级民主主义<\/span><span class=\"c-gray\">革命，<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">而是新式的、特殊的资产阶级民主主义革命。<\/span><\/p>",
   "plain": "护法运动的失败不仅是孙中山个人的失败 也标志着整个中国民族资产阶级领导的旧民主主义革命的终结 使孙中山认识到“南与北如一丘之貉”，想依靠南方军阀来反对北洋军阀行不通的事件是护法运动 五四运动成为中国革命的新阶段即新民主主义革命阶段的开端 无产阶级的领导权是中国革命的中心问题，也是新民主主义革命理论的核心问题。 区别新、旧两种不同范畴的民主主义革命的根本标志是， 革命的领导权是掌握在无产阶级手中还是掌握在资产阶级手中。 一定要注意，虽然“新民主主义革命”有个“新”字， 但其性质依然是资产阶级民主主义革命(由社会性质、革命对象、革命任务等决定)。 但是，中国革命已不是旧式的、一般的资产阶级民主主义革命， 而是新式的、特殊的资产阶级民主主义革命。",
   "page": 20
  },
  {
   "no": 50,
   "title": "辛亥革命",
   "category": "史纲",
   "group": "土地革命",
   "html": "<p class=\"kp-line\"><span class=\"c-blue\">辛亥革命之所以失败，从根本上说，是因为<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">在帝国主义时代，在半殖民地半封建的中国，<\/span><span class=\"c-rose\">资本主义的<\/span><span class=\"c-rose\">建国方案行不通<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">毛泽东说辛亥革命\"只把一个皇帝赶跑\"是指<\/span><span class=\"c-blue\">反帝反封建的<\/span><span class=\"c-blue\">革命任务没有完成<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">南京临时政府在《告友邦书》中，企图以承认清政府的不<\/span><span class=\"c-gray\">平等条约和外债来换取列强承认。所以<\/span><span class=\"c-blue\">《中华民国临时约<\/span><span class=\"c-blue\">法》是<\/span><span class=\"c-red\">承认<\/span><span class=\"c-blue\">清政府与列强签订的一系列不平等条约的<\/span><span class=\"c-gray\">。<\/span><\/p>",
   "plain": "辛亥革命之所以失败，从根本上说，是因为 在帝国主义时代，在半殖民地半封建的中国，资本主义的建国方案行不通 毛泽东说辛亥革命\"只把一个皇帝赶跑\"是指反帝反封建的革命任务没有完成 南京临时政府在《告友邦书》中，企图以承认清政府的不平等条约和外债来换取列强承认。所以《中华民国临时约法》是承认清政府与列强签订的一系列不平等条约的。",
   "page": 21
  },
  {
   "no": 51,
   "title": "中国革命能坚持和发展的原因",
   "category": "史纲",
   "group": "土地革命",
   "html": "<p class=\"kp-line\"><span class=\"c-gray\">在大革命失败、白色恐怖极其严重的条件下<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">中国革命之所以能够得到坚持和发展<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">根本原因<\/span><span class=\"c-gray\">就在于中国共产党<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">紧紧地<\/span><span class=\"c-blue\">依靠农民<\/span><span class=\"c-blue\">领导农民进行了土地制度的革命<\/span><\/p>",

   "category": "史纲",
   "group": "抗日战争",
   "html": "<p class=\"kp-line\"><span class=\"c-blue\">起点<\/span><span class=\"c-gray\">，局部抗战的开始：<\/span><span class=\"c-gray\">1931<\/span><span class=\"c-blue\">九一八<\/span><span class=\"c-gray\">事变<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">十年<\/span><span class=\"c-blue\">内战<\/span><span class=\"c-gray\">的局面由此<\/span><span class=\"c-blue\">结束<\/span><span class=\"c-gray\">：<\/span><span class=\"c-gray\">1936.12<\/span><span class=\"c-blue\">西安事变<\/span><span class=\"c-gray\">的和平解决<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">西安事变的和平解决<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">成为时局转换的枢纽，十年内战局面基本结束，国内和平<\/span><span class=\"c-gray\">初步实现<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">进入<\/span><span class=\"c-blue\">全民族抗战<\/span><span class=\"c-gray\">时期：<\/span><span class=\"c-gray\">1937.7<\/span><span class=\"c-blue\">七七/卢沟桥事变<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">抗日战争的胜利 1945<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">是近代以来中国人民反抗外敌入侵第一次取得完全胜利的<\/span><span class=\"c-gray\">民族解放斗争，<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">是中华民族从近代以来陷人深重危机走向伟大复兴的历史<\/span><span class=\"c-gray\">转折点<\/span><\/p>",

   "plain": "在战略防御阶段 国民党正面战场的正规战是主要的 敌后游击战是辅助的 在战略相持阶段 敌后游击战争成为主要的抗日作战方式 主要是在外线单独作战，而不是在内线配合正规军作战 是大规模的，而不是小规模的 灵活作战，敌退我进，敌进我退，不是进攻战也不是防守战",

   "category": "史纲",

   "html": "<p class=\"kp-line\"><span class=\"c-red\">抗日⺠族统一战线的策略总方针:<\/span><\/p><p class=\"kp-line\"><span class=\"c-orange\">发展进步势力,争取中间势力,孤立顽固势力<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">依靠中间势力<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">进步势力:<\/span><span class=\"c-gray\">工人、农⺠和城市小资产阶级<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">中间势力:<\/span><span class=\"c-blue\">⺠族资产阶级、开明绅士和地方实力派<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">顽固势力<\/span><span class=\"c-gray\">:大地主、大资产阶级的抗日派,<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">即以蒋介石集团为代表的国⺠党亲英美派<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">中国共产党对顽固派贯彻<\/span><span class=\"c-orange\">又联合又斗争<\/span><span class=\"c-blue\">的政策方针。<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">在同顽固派作斗争时，坚持<\/span><span class=\"c-orange\">有理、有利、有节<\/span><span class=\"c-blue\">的原则。<\/span><\/p>",

   "category": "史纲",
   "group": "解放战争",
   "html": "<p class=\"kp-line\"><span class=\"c-blue\">抗日战争胜利后，某些民主党派的领导人曾经鼓吹“中间<\/span><span class=\"c-blue\">路线”，<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">企图在国共对立的纲领之外寻找第三条道路。他们主张：<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">在政治上，“必须实现英美式的民主政治”，但不准地主<\/span><span class=\"c-gray\">官僚资本家操纵；<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">在经济上，“应当实行改良的资本主义”，但不容官僚买<\/span><span class=\"c-gray\">办资本横行。<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">实行的方法，则是走和平改良的道路<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">他们所提倡的，是<\/span><span class=\"c-red\">资产阶级共和国<\/span><span class=\"c-gray\">的方案，<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">他们所主张的，<\/span><span class=\"c-rose\">实质上是旧民主主义的道路<\/span><span class=\"c-gray\">。<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">但是，中国在战后面临的是<\/span><span class=\"c-blue\">两种命运、两个前途的尖锐斗<\/span><span class=\"c-blue\">争<\/span><span class=\"c-gray\">。<\/span><\/p><p class=\"kp-line\"><span class=\"c-rose\">客观形势<\/span><span class=\"c-gray\">决定了中国没有走中间路线的余地。<\/span><\/p>",

   "category": "史纲",
   "group": "解放战争",
   "html": "<p class=\"kp-line\"><span class=\"c-blue\">标志着人民解放战争战略进攻的<\/span><span class=\"c-rose\">序幕<\/span><span class=\"c-blue\">由此揭开：<\/span><span class=\"c-rose\">三路大军<\/span><span class=\"c-rose\">相互策应<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">（刘邓晋冀鲁豫野战军、陈粟华东野战军、陈谢晋冀鲁豫<\/span><span class=\"c-gray\">野战军）<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">为<\/span><span class=\"c-rose\">打败蒋介石<\/span><span class=\"c-blue\">、建立新中国奠定了深厚的<\/span><span class=\"c-rose\">群众基础<\/span><span class=\"c-blue\">的是<\/span><span class=\"c-rose\">土<\/span><span class=\"c-rose\">地制度改革<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">土地制度改革是从根本上摧毁中国封建制度根基的社<\/span><span class=\"c-gray\">会大变革<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">从1947年3月至6月，人民解放军经过4个月的内线作战，<\/span><span class=\"c-gray\">努力打退国民党军的重点进攻，并在东北、热河、冀东、<\/span><span class=\"c-gray\">豫南等地开始局部反攻。人民解放军在这一阶段的作战标<\/span><span class=\"c-gray\">志着<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">从根本上粉碎了国民党统治集团的<\/span><span class=\"c-blue\">速战速决计划<\/span><\/p><p class=\"kp-line\"><span class=\"c-orange\">三大战役后<\/span><span class=\"c-blue\">国民党赖以维持其反动统治的<\/span><span class=\"c-blue\">主要军事力量<\/span><span class=\"c-blue\">基<\/span><span class=\"c-blue\">本上被摧毁<\/span><\/p>",
   "plain": "标志着人民解放战争战略进攻的序幕由此揭开：三路大军相互策应 （刘邓晋冀鲁豫野战军、陈粟华东野战军、陈谢晋冀鲁豫野战军） 为打败蒋介石、建立新中国奠定了深厚的群众基础的是土地制度改革 土地制度改革是从根本上摧毁中国封建制度根基的社会大变革 从1947年3月至6月，人民解放军经过4个月的内线作战，努力打退国民党军的重点进攻，并在东北、热河、冀东、豫南等地开始局部反攻。人民解放军在这一阶段的作战标志着 从根本上粉碎了国民党统治集团的速战速决计划 三大战役后国民党赖以维持其反动统治的主要军事力量基本上被摧毁",
   "page": 23
  },
  {
   "no": 62,
   "title": "转折点",
   "category": "史纲",
   "group": "解放战争",
   "html": "<p class=\"kp-line\"><span class=\"c-red\">）<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">1947米脂县 革命两个转折点（米帝死期<\/span><span class=\"c-red\">1949进北平 革命重心开始变<\/span><span class=\"c-red\">1947<\/span><span class=\"c-gray\">年12月 中共中央在陕北<\/span><span class=\"c-red\">米脂县<\/span><span class=\"c-gray\">杨家沟召开会议<\/span><span class=\"c-gray\">制定了夺取全国胜利的行动纲领<\/span><span class=\"c-gray\">毛泽东指出 中国革命已经发展到了一个历史的转折点<\/span><span class=\"c-red\">蒋<\/span><span class=\"c-blue\">介石20年反革命统治由发展到消灭的<\/span><span class=\"c-red\">转折点<\/span><span class=\"c-blue\">一百多年来<\/span><span class=\"c-red\">帝<\/span><span class=\"c-blue\">国主义在中国的统治由发展到消灭的<\/span><span class=\"c-red\">转折点<\/span><span class=\"c-red\">1949<\/span><span class=\"c-gray\">年3月25日 毛泽东等中央领导人与中央机关<\/span><span class=\"c-gray\">人民解放军总部<\/span><span class=\"c-red\">进<\/span><span class=\"c-gray\">驻<\/span><span class=\"c-red\">北平<\/span><span class=\"c-gray\">（北京）香山<\/span><span class=\"c-blue\">标志着中国<\/span><span class=\"c-red\">革命重心<\/span><span class=\"c-blue\">从农村转向城市<\/span><span class=\"c-red\">辨析<\/span><span class=\"c-red\">秋收起义<\/span>—<span class=\"c-blue\">城市转农村<\/span><span class=\"c-red\">进驻香山<\/span>—<span class=\"c-blue\">农村转城市<\/span><span class=\"c-orange\">七届二中全会<\/span><span class=\"c-gray\">说明了党的<\/span><span class=\"c-red\">工作重心<\/span><span class=\"c-gray\">必须<\/span><span class=\"c-blue\">由农村转移到城市<\/span><\/p>",
   "plain": "） 1947米脂县 革命两个转折点（米帝死期1949进北平 革命重心开始变1947年12月 中共中央在陕北米脂县杨家沟召开会议制定了夺取全国胜利的行动纲领毛泽东指出 中国革命已经发展到了一个历史的转折点蒋介石20年反革命统治由发展到消灭的转折点一百多年来帝国主义在中国的统治由发展到消灭的转折点1949年3月25日 毛泽东等中央领导人与中央机关人民解放军总部进驻北平（北京）香山标志着中国革命重心从农村转向城市辨析秋收起义—城市转农村进驻香山—农村转城市七届二中全会说明了党的工作重心必须由农村转移到城市",
   "page": 23
  },

   "no": 63,
   "title": "建国初期",
   "category": "史纲",
   "group": "建国后",
   "html": "<p class=\"kp-line\"><span class=\"c-red\">三大外交政策<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">一边<\/span><span class=\"c-orange\">倒<\/span><span class=\"c-blue\">，<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">另起<\/span><span class=\"c-orange\">炉灶<\/span><span class=\"c-blue\">，<\/span><\/p><p class=\"kp-line\"><span class=\"c-orange\">打扫<\/span><span class=\"c-blue\">干净<\/span><span class=\"c-orange\">屋子<\/span><span class=\"c-blue\">再请客<\/span><\/p><p class=\"kp-line\"><span class=\"c-orange\">打扫屋子倒炉灶<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">针对党政干部中存在的<\/span><span class=\"c-blue\">腐化<\/span><span class=\"c-gray\">问题<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">中国共产党开展了<\/span><span class=\"c-red\">三反运动<\/span><span class=\"c-gray\">：<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">反<\/span><span class=\"c-blue\">贪污<\/span><span class=\"c-gray\">，反<\/span><span class=\"c-blue\">浪费<\/span><span class=\"c-gray\">，反<\/span><span class=\"c-blue\">官僚主义<\/span><\/p>",
   "plain": "三大外交政策 一边倒， 另起炉灶， 打扫干净屋子再请客 打扫屋子倒炉灶 针对党政干部中存在的腐化问题 中国共产党开展了三反运动： 反贪污，反浪费，反官僚主义",

   "no": 64,
   "title": "中国社会的阶级构成",
   "category": "史纲",
   "group": "建国后",
   "html": "<p class=\"kp-line\"><span class=\"c-red\">工农小民<\/span><span class=\"c-blue\">（无产阶级也称为工人阶级）<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">新民主主义时期 中国社会的阶级构成：<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">工<\/span><span class=\"c-blue\">人阶级<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">农<\/span><span class=\"c-blue\">民阶级<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">小<\/span><span class=\"c-blue\">资产阶级<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">民<\/span><span class=\"c-blue\">族资产阶级<\/span><\/p>",
   "plain": "工农小民（无产阶级也称为工人阶级） 新民主主义时期 中国社会的阶级构成： 工人阶级 农民阶级 小资产阶级 民族资产阶级",
   "page": 24
  },
  {
   "no": 65,
   "title": "多党合作和政治协商格局的形成",
   "category": "史纲",
   "group": "建国后",
   "html": "<p class=\"kp-line\"><span class=\"c-blue\">喊话<\/span><span class=\"c-rose\">——<\/span><span class=\"c-gray\">五一口号<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">得到了热烈回应；揭开了序幕；奠定了基础。<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">回应<\/span><span class=\"c-rose\">——<\/span><span class=\"c-gray\">《对时局的意见》<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">各党派和无党派公开自愿接受共产党的领导。<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">民主党派和无党派民主人士决心走<\/span><span class=\"c-red\">人民革命<\/span><span class=\"c-gray\">的道路<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">谈话<\/span><span class=\"c-rose\">——<\/span><span class=\"c-gray\">毛泽东谈话（1949春）<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">“积极参政，共同建设新中国”；<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">标志着民主党派地位的根本变化<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">确立<\/span><span class=\"c-rose\">——<\/span><span class=\"c-gray\">1949 年人民政协<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">确立了中国的新型政党制度<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">辨析<\/span><\/p><p class=\"kp-line\"><span class=\"c-orange\">1946年政协会议协议还<\/span><span class=\"c-red\">不是新民主主义性质<\/span><span class=\"c-orange\">的<\/span><span class=\"c-gray\">，<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">但它有利于冲破蒋介石的独裁统治和实行民主政治，<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">有利于和平建国，因而在相当程度上有利于人民<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">1949年人民政协是以工农联盟为基础的人民民主统一<\/span><span class=\"c-blue\">战线的组织形式<\/span><\/p>",
   "plain": "喊话——五一口号 得到了热烈回应；揭开了序幕；奠定了基础。 回应——《对时局的意见》 各党派和无党派公开自愿接受共产党的领导。 民主党派和无党派民主人士决心走人民革命的道路 谈话——毛泽东谈话（1949春） “积极参政，共同建设新中国”； 标志着民主党派地位的根本变化 确立——1949 年人民政协 确立了中国的新型政党制度 辨析 1946年政协会议协议还不是新民主主义性质的， 但它有利于冲破蒋介石的独裁统治和实行民主政治， 有利于和平建国，因而在相当程度上有利于人民 1949年人民政协是以工农联盟为基础的人民民主统一战线的组织形式",
   "page": 24
  },
  {
   "no": 66,
   "title": "“一五”计划",
   "category": "史纲",
   "group": "建国后",
   "html": "<p class=\"kp-line\"><span class=\"c-gray\">“一五”计划确定的经济建设指导方针突出的<\/span><span class=\"c-rose\">核心要点<\/span><span class=\"c-gray\">是<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">集中主要力量发展<\/span><span class=\"c-orange\">重工业<\/span><span class=\"c-gray\">，建立国家工业化和国防现代化<\/span><span class=\"c-gray\">的初步基础<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">1952年左右，我国工业化建设取得巨大成就<\/span><\/p>",
   "plain": "“一五”计划确定的经济建设指导方针突出的核心要点是 集中主要力量发展重工业，建立国家工业化和国防现代化的初步基础 1952年左右，我国工业化建设取得巨大成就",
   "page": 24
  },
  {
   "no": 67,
   "title": "对个体手工业的社会主义改造的方法",
   "category": "史纲",
   "group": "建国后",
   "html": "<p class=\"kp-line\"><span class=\"c-gray\">对个体手工业的社会主义改造的方<\/span><span class=\"c-red\">法<\/span><span class=\"c-gray\">：<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">说<\/span><span class=\"c-blue\">服教育 典型示范和国家帮助<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">（说法）<\/span><\/p><p class=\"kp-line\"><span class=\"c-purple\">补充<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">对手工业的社会主义改造的<\/span><span class=\"c-blue\">方<\/span><span class=\"c-red\">针<\/span><span class=\"c-gray\">：<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">积极<\/span><span class=\"c-blue\">领导<\/span><span class=\"c-red\">稳<\/span><span class=\"c-blue\">步前进<\/span><span class=\"c-red\">（针积极 针<\/span><span class=\"c-gray\">滴<\/span><span class=\"c-red\">稳）<\/span><\/p><p class=\"kp-line\"><span class=\"c-orange\">对农业的社会主义改造也是这个方针<\/span><\/p>",
   "plain": "对个体手工业的社会主义改造的方法： 说服教育 典型示范和国家帮助 （说法） 补充 对手工业的社会主义改造的方针： 积极领导 稳步前进（针积极 针滴稳） 对农业的社会主义改造也是这个方针",
   "page": 24

   "no": 68,
   "title": "农业社会主义改造遵循的原则",
   "category": "史纲",
   "group": "建国后",
   "html": "<p class=\"kp-line\"><span class=\"c-red\">农原立典<\/span><\/p><p class=\"kp-line\"><span class=\"c-red\">农<\/span><span class=\"c-blue\">业社会主义改造遵循的<\/span><span class=\"c-red\">原<\/span><span class=\"c-blue\">则是<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">自愿互<\/span><span class=\"c-red\">利 典<\/span><span class=\"c-blue\">型示范和国家帮助<\/span><\/p>",
   "plain": "农原立典 农业社会主义改造遵循的原则是 自愿互利 典型示范和国家帮助",
   "page": 24
  },
  {
   "no": 69,
   "title": "资本主义工商业改造",
   "category": "史纲",
   "group": "建国后",
   "html": "<p class=\"kp-line\"><span class=\"c-gray\">资本主义工商业改造三大步骤：<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">第一步：<\/span><span class=\"c-blue\">初级形式国家资本主义<\/span><span class=\"c-gray\">，形式为计划订货，<\/span><span class=\"c-gray\">统购包销-代工厂<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">特点：国家与私人企业在<\/span><span class=\"c-orange\">企业外部<\/span><span class=\"c-gray\">的合作<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">性质：<\/span><span class=\"c-blue\">社会主义萌芽性质(具有社会主义因素)<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">第二步：<\/span><span class=\"c-blue\">个人企业公私合营<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">特点：生产资料归国家和资本家共同占有，公方占领导地<\/span><span class=\"c-gray\">位<\/span><\/p><p class=\"kp-line\"><span class=\"c-orange\">（一，二步都是四马分肥）<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">性质：<\/span><span class=\"c-blue\">半社会主义性质<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">第三步：<\/span><span class=\"c-blue\">全行业公私合营<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">特点：企业变成社会主义国营企业<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">性质：<\/span><span class=\"c-blue\">完全的社会主义性质<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">我国对资本主义工商业的社会主义改造执行的是<\/span><span class=\"c-red\">和平<\/span><span class=\"c-red\">赎买<\/span><span class=\"c-blue\">的政策<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">社会主义改造成功的历史经验包括公有制经济可以和非公<\/span><span class=\"c-gray\">有制经济共同发展<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">对社会主义改造基本完成以后<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">公有制经济可以和非公有制经济共同发展<\/span><span class=\"c-red\">缺乏认识<\/span><span class=\"c-blue\">，是改<\/span><span class=\"c-blue\">造中的一个偏差<\/span><\/p>",
   "plain": "资本主义工商业改造三大步骤： 第一步：初级形式国家资本主义，形式为计划订货，统购包销-代工厂 特点：国家与私人企业在企业外部的合作 性质：社会主义萌芽性质(具有社会主义因素) 第二步：个人企业公私合营 特点：生产资料归国家和资本家共同占有，公方占领导地位 （一，二步都是四马分肥） 性质：半社会主义性质 第三步：全行业公私合营 特点：企业变成社会主义国营企业 性质：完全的社会主义性质 我国对资本主义工商业的社会主义改造执行的是和平赎买的政策 社会主义改造成功的历史经验包括公有制经济可以和非公有制经济共同发展 对社会主义改造基本完成以后 公有制经济可以和非公有制经济共同发展缺乏认识，是改造中的一个偏差",
   "page": 24
  },
  {
   "no": 70,
   "title": "五种经济成分",
   "category": "史纲",
   "group": "建国后",
   "html": "<p class=\"kp-line\"><span class=\"c-blue\">合作社经济：从个体经济向社会主义集体经济过渡的形式<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">国家资本主义经济<\/span><span class=\"c-blue\">：私人资本主义经济向社会主义国<\/span><span class=\"c-blue\">营经济过渡的形式<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">改造资本主义工商业并向社会主义过渡的<\/span><span class=\"c-orange\">必经之路<\/span><span class=\"c-blue\">是<\/span><span class=\"c-blue\">国家资本主义<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">新民主主义社会的五种经济成分中<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">处于<\/span><span class=\"c-rose\">十字路口<\/span><span class=\"c-gray\">的经济成分是：<\/span><span class=\"c-blue\">个体经济<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">十字路口有路标<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">像“个”<\/span><\/p>",
   "plain": "合作社经济：从个体经济向社会主义集体经济过渡的形式 国家资本主义经济：私人资本主义经济向社会主义国营经济过渡的形式 改造资本主义工商业并向社会主义过渡的必经之路是国家资本主义 新民主主义社会的五种经济成分中 处于十字路口的经济成分是：个体经济 十字路口有路标 像“个”",

   "category": "史纲",
   "group": "建国后",
   "html": "<p class=\"kp-line is-bullet\"><span class=\"c-blue\">1. 深刻回答了什么是社会主义、怎样建设社会主义这一<\/span><span class=\"c-blue\">根本问题。<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-blue\">2. 深刻揭示社会主义本质。<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-blue\">3.<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">为我国改革开放和社会主义现代化建设提供了行动指南。<\/span><\/p><p class=\"kp-line is-bullet\"><span class=\"c-blue\">4. 是中国特色社会主义理论体系的奠基之作。<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">邓小平理论<\/span><span class=\"c-blue\">的精髓：<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">解放思想、<\/span><span class=\"c-red\">实事求是<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">辨析<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">邓小平理论———什么是社会主义、怎样建设社会主义<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">看到<\/span><span class=\"c-blue\">邓小平<\/span><span class=\"c-gray\">，就想<\/span><span class=\"c-blue\">社会主义<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">“三个代表”重要思想———建设什么样的党、怎样建设<\/span><span class=\"c-gray\">党<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">科学发展观——实现什么样的发展、怎样发展<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">习思想——“新时代坚持和发展什么样的中国特色社会主<\/span><span class=\"c-gray\">义、怎样坚持和发展中国特色社会主义，建设什么样的社<\/span><span class=\"c-gray\">会主义现代化强国、怎样建设社会主义现代化强国，建设<\/span><span class=\"c-gray\">什么样的长期执政的马克思主义政党、怎样建设长期执政<\/span><span class=\"c-gray\">的马克思主义政党”。<\/span><\/p>",

   "category": "史纲",
   "group": "建国后",
   "html": "<p class=\"kp-line\"><span class=\"c-blue\">党际关系“四项原则”<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">“独立自<\/span><span class=\"c-rose\">主<\/span><span class=\"c-gray\">、完全<\/span><span class=\"c-rose\">平<\/span><span class=\"c-gray\">等、互<\/span><span class=\"c-rose\">相<\/span><span class=\"c-gray\">尊重、互不干涉<\/span><span class=\"c-rose\">内部事务<\/span><span class=\"c-gray\">”<\/span><\/p><p class=\"kp-line\"><span class=\"c-rose\">竹坪乡<\/span><span class=\"c-gray\">的<\/span><span class=\"c-rose\">内部事务<\/span><\/p><p class=\"kp-line\"><span class=\"c-rose\">和平与发展<\/span><span class=\"c-blue\">是当今世界的两大主题的重要论断<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">如果一切从本本出发思想僵化，迷信盛行，那它就不能前<\/span><span class=\"c-blue\">进<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">1979党的理论工作务虚会首次提出<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">“四项基本原则”<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">1982十二大提出<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">建设有中国特色的社会主义<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">为建设中国特色社会主义提供<\/span><span class=\"c-red\">总依据<\/span><span class=\"c-gray\">的是<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">社会主义初级阶段理论<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">社会主义初级阶段基本路线的核心内容<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">“一个中心、两个基本点”<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">以经济建设为<\/span><span class=\"c-rose\">中心<\/span><span class=\"c-gray\">，<\/span><span class=\"c-rose\">坚持<\/span><span class=\"c-gray\">四项基本原则，<\/span><span class=\"c-rose\">坚持<\/span><span class=\"c-gray\">改革开放<\/span><\/p><p class=\"kp-line\"><span class=\"c-gray\">邓小平在领导<\/span><span class=\"c-blue\">改革开放和现代化建设<\/span><span class=\"c-gray\">这一新的革命过程中<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">不断提出和反复思考的<\/span><span class=\"c-orange\">首要的基本的理论问题<\/span><span class=\"c-blue\">是<\/span><\/p><p class=\"kp-line\"><span class=\"c-rose\">什么是社会主义、怎样建设社会主义<\/span><\/p><p class=\"kp-line\"><span class=\"c-blue\">搞清楚这一基本理论问题，<\/span><span class=\"c-orange\">关键是要<\/span><\/p><p class=\"kp-line\"><span class=\"c-rose\">在坚持社会主义基本制度的基础上进一步认清社会主义的<\/span><span class=\"c-rose\">本质<\/span><\/p>",
   "plain": "党际关系“四项原则” “独立自主、完全平等、互相尊重、互不干涉内部事务” 竹坪乡的内部事务 和平与发展是当今世界的两大主题的重要论断 如果一切从本本出发思想僵化，迷信盛行，那它就不能前进 1979党的理论工作务虚会首次提出 “四项基本原则” 1982十二大提出 建设有中国特色的社会主义 为建设中国特色社会主义提供总依据的是 社会主义初级阶段理论 社会主义初级阶段基本路线的核心内容 “一个中心、两个基本点” 以经济建设为中心，坚持四项基本原则，坚持改革开放 邓小平在领导改革开放和现代化建设这一新的革命过程中 不断提出和反复思考的首要的基本的理论问题是 什么是社会主义、怎样建设社会主义 搞清楚这一基本理论问题，关键是要 在坚持社会主义基本制度的基础上进一步认清社会主义的本质",

   "category": "史纲",
